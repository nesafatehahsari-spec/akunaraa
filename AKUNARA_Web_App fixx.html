i.\n 2. Sekretaris Desa memverifikasi kelengkapan dokumen.\n 3. Kepala Desa menyetujui.\n 4. Bendahara membayar dan memotong atau memungut pajak.\n 5. Bendahara mencatat pada BKU dan buku pembantu.\n 6. Bendahara menyetor pajak dan melaporkan.\n\n4. Contoh pencatatan BKU Desa Sukamaju, bulan Maret\n\n  Tgl         Uraian                              Penerimaan      Pengeluaran        Saldo (Rp)\n                                                  (Rp)            (Rp)\n\n  1           Saldo awal (kas tunai 5.000.000 +                                      100.000.000\n              bank 95.000.000)\n\n  3           Penerimaan Dana Desa tahap I ke     320.000.000                        420.000.000\n              rekening desa\n\n  8           Belanja ATK kantor desa (harga                      4.440.000          415.560.000\n              4.000.000 + PPN 440.000)\n  Tgl         Uraian                                   Penerimaan         Pengeluaran        Saldo (Rp)\n                                                       (Rp)               (Rp)\n\n  8           Pungutan PPN atas belanja ATK            440.000                               416.000.000\n\n  12          Honor operator desa                                         2.000.000          414.000.000\n\n  20          Belanja bahan bangunan jalan                                45.000.000         369.000.000\n              lingkungan\n\n  25          Setor PPN ke kas negara                                     440.000            368.560.000\n\n  30          Saldo akhir                                                                    368.560.000\n\nPada contoh, belanja ATK senilai 4.440.000 terdiri atas harga barang 4.000.000 yang\ndibayar ke toko dan PPN 440.000 yang dipungut bendahara lalu disetor ke kas negara.\nHonor operator dianggap belum terkena PPh 21 karena penghasilannya di bawah batas\npemotongan. Guru dapat menyesuaikan contoh dengan format BKU resmi dan aplikasi\nyang dipakai desa.\n\n5. Pelaporan dan pertanggungjawaban\n\n  Laporan                                           Waktu                             Disampaikan\n                                                                                      kepada\n\n  Laporan realisasi pelaksanaan                     Paling lambat akhir Juli          Bupati/wali kota\n  APBDes semester pertama\n\n  Laporan realisasi semester akhir                  Paling lambat akhir Januari       Bupati/wali kota\n  (laporan akhir tahun)                             tahun berikutnya\n\n  Laporan pertanggungjawaban                        Paling lambat akhir Maret         BPD dan\n  realisasi APBDes                                  tahun berikutnya                  bupati/wali kota\n\nBatas waktu dapat berubah mengikuti regulasi dan sebaiknya dikonfirmasi kembali.\n\n6. Contoh laporan realisasi APBDes (ringkas)\n\n  Uraian                    Anggaran (Rp)   Realisasi (Rp)   Lebih/(Kurang) (Rp)      %\n\n  Pendapatan                1.335.000.000   1.300.000.000    (35.000.000)             97,4\n\n  Belanja                   1.310.000.000   1.250.000.000    (60.000.000)             95,4\n\n  Surplus                   25.000.000      50.000.000       25.000.000\n   \\text{Persentase realisasi} = \\frac{\\text{Realisasi}}{\\text{Anggaran}} \\times\n   100\\%\n\nD. Keuangan Instansi Pemerintah Daerah\nSekolah negeri, dinas, dan puskesmas mengelola uang publik melalui APBD. Alurnya lebih\npanjang dibanding desa.\n\n  Tahap                     Dokumen                       Keterangan\n\n  Perencanaan               RPJMD, RKPD                   Rencana lima tahunan dan tahunan\n\n  Penganggaran              KUA-PPAS, RKA-SKPD, Perda     Kebijakan umum anggaran dan prioritas\n                            APBD\n\n  Pelaksanaan               DPA-SKPD, SPD                 Dokumen pelaksanaan anggaran dan\n                                                          penyediaan dana\n\n  Pembayaran                SPP, SPM, SP2D                Permintaan, perintah, dan pencairan dana\n\n  Penatausahaan             Buku kas umum, buku           Dicatat bendahara\n                            pembantu\n\n  Pelaporan                 LRA, Neraca, LO, LPE, LAK,    Mengikuti Standar Akuntansi\n                            CaLK                          Pemerintahan\n\nJenis laporan keuangan pemerintah\n\n  Laporan                                         Isi\n\n  Laporan Realisasi Anggaran (LRA)                Perbandingan anggaran dan realisasi pendapatan,\n                                                  belanja, dan pembiayaan\n\n  Laporan Perubahan SAL                           Perubahan Saldo Anggaran Lebih\n\n  Neraca                                          Aset, kewajiban, dan ekuitas\n\n  Laporan Operasional (LO)                        Pendapatan-LO dan beban\n\n  Laporan Perubahan Ekuitas (LPE)                 Perubahan ekuitas\n\n  Laporan Arus Kas (LAK)                          Arus kas operasi, investasi, pendanaan, dan\n                                                  transitoris\n\n  Catatan atas Laporan Keuangan                   Penjelasan dan rincian\n  (CaLK)\nStandar akuntansi pemerintahan menganut basis akrual untuk laporan operasional,\nneraca, perubahan ekuitas, dan basis kas untuk LRA dan LAK.\n\nE. Aktivitas Praktikum\n 1. Simulasi musyawarah desa: siswa berperan sebagai kepala desa, sekretaris desa, kaur\n     keuangan, BPD, dan warga untuk menyepakati prioritas kegiatan.\n 2. Menyusun APBDes sederhana dari data pendapatan dan prioritas kegiatan.\n 3. Mengisi BKU, buku pembantu pajak, dan buku bank dari 15 sampai 20 transaksi.\n 4. Menyusun laporan realisasi dan menghitung persentase realisasi.\n 5. Kunjungan atau wawancara dengan perangkat desa atau bendahara sekolah untuk\n     membandingkan praktik di lapangan dengan teori.\n\nRangkuman Modul 4\n     Akuntansi pemerintah berorientasi pelayanan publik, anggaran menjadi dokumen\n     hukum, dan akuntabilitas menjadi tujuan utama.\n     Siklus keuangan desa: perencanaan, penganggaran, pelaksanaan, penatausahaan,\n     pelaporan, dan pertanggungjawaban.\n     Penatausahaan desa memakai basis kas dengan BKU sebagai buku utama.\n     Keuangan daerah mengikuti alur anggaran APBD sampai pencairan SP2D, dan\n     dilaporkan dengan laporan keuangan menurut SAP.\n\nLatihan Modul 4\n 1. Jelaskan tiga perbedaan utama akuntansi perusahaan dan akuntansi pemerintah.\n 2. Sebutkan enam tahap siklus pengelolaan keuangan desa beserta dokumen utamanya.\n 3. Desa Makmur mendapat pendapatan: Dana Desa 600 jt, ADD 300 jt, PADes 20 jt.\n     Belanja: pemerintahan 380 jt, pembangunan 400 jt, pembinaan 50 jt, pemberdayaan 70\n     jt. Hitung total pendapatan, total belanja, dan surplus atau defisit. Bila SiLPA tahun lalu\n     25 jt dan tidak ada pengeluaran pembiayaan, hitung SiLPA tahun berjalan.\n 4. Apa fungsi BKU dan buku pembantu pajak? Siapa yang mengisinya?\n 5. Hitung persentase realisasi belanja bidang pembangunan bila anggarannya 400 jt dan\n     realisasinya 372 jt.\n\nKunci Jawaban Singkat\n     Nomor 3: Pendapatan = 920 jt. Belanja = 900 jt. Surplus = 20 jt. SiLPA tahun berjalan =\n     20 + 25 = 45 jt.\n     Nomor 5: 372 : 400 × 100% = 93%.", "Modul 5. Administrasi Pajak & Akuntansi Perpajakan\n\nTujuan Pembelajaran\nSetelah mempelajari modul ini, peserta didik mampu:\n\n 1. Menjelaskan fungsi pajak, jenis pajak, dan hak serta kewajiban wajib pajak.\n 2. Menghitung PPh Pasal 21 dan menyiapkan bukti potongnya.\n 3. Menghitung PPh Pasal 23, PPh final, dan PPh badan.\n 4. Menghitung PPN keluaran, PPN masukan, dan PPN yang harus disetor.\n 5. Mengadministrasikan penyetoran dan pelaporan pajak (SPT Masa dan SPT Tahunan).\n 6. Melakukan rekonsiliasi fiskal sederhana.\n\n    Catatan penting untuk guru: tarif, batasan omzet, nilai PTKP, tabel tarif efektif, dan\n    sistem aplikasi (Coretax) pernah dan dapat berubah. Angka di bawah memakai\n    ketentuan yang berlaku pada saat materi ini disusun. Periksa situs resmi DJP\n    (pajak.go.id) dan peraturan terbaru sebelum menggunakannya di kelas.\n\nA. Dasar-Dasar Perpajakan\nPajak adalah kontribusi wajib kepada negara yang terutang oleh orang pribadi atau badan\nyang bersifat memaksa berdasarkan undang-undang, dengan tidak mendapatkan imbalan\nsecara langsung, dan digunakan untuk keperluan negara bagi sebesar-besarnya\nkemakmuran rakyat.\n\nFungsi pajak: anggaran (sumber penerimaan negara), mengatur (alat kebijakan ekonomi\ndan sosial), redistribusi (pemerataan pendapatan), dan stabilisasi.\n\nSistem pemungutan pajak:\n\n  Sistem                    Ciri                                Contoh\n\n  Self assessment           Wajib pajak menghitung, membayar,   PPh orang pribadi dan badan,\n                            dan melaporkan sendiri              PPN\n\n  Official                  Fiskus menghitung dan menetapkan    Pajak bumi dan bangunan pada\n  assessment                                                    sebagian daerah\n\n  Withholding               Pihak ketiga memotong atau          PPh 21, 22, 23\n  system                    memungut\n\nJenis pajak menurut lembaga pemungut:\n  Pajak pusat                                              Pajak daerah\n\n  PPh, PPN dan PPnBM, bea meterai, PBB                     Pajak kendaraan bermotor, PBB perdesaan\n  sektor tertentu                                          dan perkotaan, BPHTB, pajak\n                                                           restoran/hotel/hiburan\n\nHak dan kewajiban wajib pajak\n\n  Kewajiban                                                  Hak\n\n  Mendaftarkan diri dan memiliki NPWP                        Mengajukan keberatan dan banding\n\n  Menghitung, membayar, dan melaporkan                       Meminta pengembalian kelebihan\n  pajak                                                      pembayaran\n\n  Menyelenggarakan pembukuan atau                            Mengajukan pembetulan SPT\n  pencatatan\n\n  Memenuhi pemeriksaan                                       Mendapat kerahasiaan data\n\nIdentitas perpajakan. Dalam perkembangan terbaru, NIK untuk orang pribadi dipadankan\nsebagai NPWP, sedangkan badan memiliki NPWP tersendiri. Administrasi perpajakan\nsecara bertahap dipindahkan ke sistem Coretax DJP, mencakup pendaftaran,\npembayaran (kode billing), faktur pajak, bukti potong, dan pelaporan SPT.\n\nB. Pajak Penghasilan (PPh)\n1. Subjek dan objek. Subjek PPh adalah orang pribadi, warisan yang belum terbagi, badan,\ndan bentuk usaha tetap. Objek PPh adalah penghasilan, yaitu tambahan kemampuan\nekonomis dari pekerjaan, usaha, modal, atau sumber lain.\n\n2. Ragam PPh yang dipelajari di SMK\n\n  Pasal                     Objek                                            Sifat\n\n  PPh 21                    Penghasilan sehubungan dengan pekerjaan,         Dipotong pemberi kerja\n                            jasa, dan kegiatan orang pribadi\n\n  PPh 22                    Impor, pembelian oleh bendahara pemerintah,      Dipungut\n                            dan transaksi tertentu\n\n  PPh 23                    Dividen, bunga, royalti, sewa selain tanah dan   Dipotong, tarif 2% atau\n                            bangunan, jasa tertentu                          15%\n  Pasal                     Objek                                          Sifat\n\n  PPh 4 ayat                Sewa tanah dan bangunan, bunga deposito,       Final\n  (2)                       jasa konstruksi, dan lainnya\n\n  PPh 25                    Angsuran bulanan PPh tahun berjalan            Dibayar sendiri\n\n  PPh 29                    Kekurangan bayar pada akhir tahun              Dibayar sendiri\n\n3. PPh 21 pegawai tetap\n\nLangkah penghitungan secara tahunan (dipakai pada masa pajak terakhir):\n\n 1. Hitung penghasilan bruto setahun (gaji, tunjangan, premi asuransi yang dibayar\n     pemberi kerja, bonus dan THR).\n 2. Kurangi biaya jabatan, yaitu 5% dari penghasilan bruto dengan batas maksimum\n     Rp500.000 per bulan atau Rp6.000.000 per tahun. Kurangi pula iuran pensiun atau JHT\n     yang dibayar pegawai.\n 3. Hasilnya adalah penghasilan neto setahun.\n 4. Kurangi PTKP.\n 5. Hasilnya adalah penghasilan kena pajak (PKP), dibulatkan ke bawah hingga ribuan\n     penuh.\n 6. Kalikan PKP dengan tarif progresif Pasal 17.\n\nPTKP (contoh nilai yang berlaku):\n\n  Status                                             PTKP per tahun (Rp)\n\n  Wajib pajak orang pribadi (TK/0)                   54.000.000\n\n  Tambahan kawin (K)                                 4.500.000\n\n  Tambahan tiap tanggungan (maksimal 3)              4.500.000 per tanggungan\n\nTarif Pasal 17 orang pribadi:\n\n  Lapisan penghasilan kena pajak                            Tarif\n\n  Sampai Rp60.000.000                                       5%\n\n  Di atas Rp60.000.000 sampai Rp250.000.000                 15%\n\n  Di atas Rp250.000.000 sampai Rp500.000.000                25%\n\n  Di atas Rp500.000.000 sampai Rp5.000.000.000              30%\n  Lapisan penghasilan kena pajak                  Tarif\n\n  Di atas Rp5.000.000.000                         35%\n\nContoh. Budi (TK/0) bergaji Rp8.000.000 per bulan, tanpa tunjangan lain dan tanpa iuran\npensiun.\n\n  Langkah                    Perhitungan                                      Hasil (Rp)\n\n  Penghasilan bruto          8.000.000 × 12                                   96.000.000\n  setahun\n\n  Biaya jabatan              5% × 96.000.000 = 4.800.000 (di bawah batas      (4.800.000)\n                             6.000.000)\n\n  Penghasilan neto                                                            91.200.000\n\n  PTKP TK/0                                                                   (54.000.000)\n\n  PKP                                                                         37.200.000\n\n  PPh 21 setahun             5% × 37.200.000                                  1.860.000\n\n  Rata-rata per bulan        1.860.000 : 12                                   155.000\n\nTarif Efektif Rata-rata (TER). Untuk masa pajak Januari sampai November, pemotongan\nbulanan memakai persentase dari Tabel TER menurut kategori PTKP (kategori A, B, atau\nC) yang ditetapkan dalam peraturan menteri keuangan. Pada masa pajak terakhir\n(Desember), pemotongan dihitung ulang dengan tarif Pasal 17 secara setahun penuh\nseperti contoh di atas, lalu dikurangi PPh 21 yang telah dipotong Januari sampai\nNovember. Siswa dapat memakai tabel TER resmi yang diunduh dari situs DJP.\n\n4. PPh 23\n\nContoh. PT Sentosa membayar jasa konsultan manajemen Rp10.000.000 kepada CV Arta\n(punya NPWP). Tarif PPh 23 jasa = 2%. PPh 23 = 2% × 10.000.000 = 200.000. PT Sentosa\nmembayar 9.800.000 kepada CV Arta dan menerbitkan bukti potong. PPh 23 disetor\nsebagai kredit pajak bagi CV Arta.\n\nJurnal PT Sentosa: Beban Jasa Konsultan 10.000.000 (D) / Kas 9.800.000 (K) dan Utang\nPPh 23 200.000 (K). Bila tidak memiliki NPWP, tarif lebih tinggi sesuai ketentuan.\n\n5. PPh Final UMKM\n\nWajib pajak yang peredaran bruto usahanya tidak melebihi Rp4,8 miliar setahun dapat\nmemakai tarif final 0,5% dari peredaran bruto. Untuk wajib pajak orang pribadi, ada\nbagian omzet sampai Rp500 juta setahun yang tidak dikenai pajak. Fasilitas ini memiliki\njangka waktu pemanfaatan yang berbeda untuk orang pribadi, CV/koperasi/firma, dan PT.\nPeriksa ketentuan terbaru.\n\nContoh. Omzet usaha toko Bu Rina bulan Mei Rp60.000.000. PPh final = 0,5% ×\n60.000.000 = 300.000. Pajak disetor dengan kode billing paling lambat tanggal 15 bulan\nberikutnya.\n\nJurnal: Beban Pajak Final 300.000 (D) / Kas 300.000 (K) pada saat pembayaran.\n\n6. PPh Badan\n\nTarif umum PPh badan adalah 22% dari penghasilan kena pajak. Perseroan terbuka yang\nmemenuhi syarat tertentu dapat memperoleh tarif lebih rendah. Wajib pajak badan\ndengan peredaran bruto sampai Rp50 miliar mendapat fasilitas pengurangan tarif 50%\nuntuk bagian peredaran bruto sampai Rp4,8 miliar.\n\nC. Rekonsiliasi Fiskal\nLaporan keuangan komersial disusun menurut standar akuntansi, sedangkan pajak\nmengikuti undang-undang. Selisihnya disesuaikan dengan koreksi fiskal.\n\n  Jenis koreksi             Contoh                                               Pengaruh\n\n  Koreksi positif           Beban yang tidak boleh dikurangkan (sumbangan        Laba fiskal naik\n                            non-wajib, jamuan tanpa daftar nominatif, PPh yang\n                            dibayar perusahaan, denda pajak)\n\n  Koreksi negatif           Penghasilan yang sudah dikenai PPh final atau        Laba fiskal turun\n                            bukan objek pajak (bunga deposito, bagi hasil)\n\nContoh PPh badan PT Maju Jaya.\n\n  Uraian                                                 Jumlah (Rp)\n\n  Laba komersial sebelum pajak                           120.000.000\n\n  Koreksi positif: sumbangan non-deductible              10.000.000\n\n  Koreksi positif: denda pajak                           2.000.000\n\n  Koreksi negatif: bunga deposito (PPh final)            (7.000.000)\n\n  Penghasilan kena pajak (laba fiskal)                   125.000.000\n\n  PPh terutang 22%                                       27.500.000\n\n  Kredit pajak: PPh 25 yang dibayar                      (14.000.000)\n  Uraian                                              Jumlah (Rp)\n\n  Kredit pajak: PPh 23 yang dipotong pihak lain       (3.000.000)\n\n  PPh Pasal 29 kurang bayar                           10.500.000\n\nJurnal beban pajak akhir tahun: Beban Pajak Penghasilan 27.500.000 (D) / Utang PPh 29\n10.500.000 dan Pajak Dibayar Dimuka (PPh 25 dan 23) 17.000.000 (K).\n\nD. Pajak Pertambahan Nilai (PPN)\nPPN adalah pajak atas konsumsi barang dan jasa di dalam negeri yang dipungut pada\nsetiap mata rantai produksi dan distribusi. Beban pajak akhirnya ditanggung konsumen.\n\n1. Pengusaha Kena Pajak (PKP). Pengusaha yang peredaran bruto setahun melebihi Rp4,8\nmiliar wajib dikukuhkan sebagai PKP. PKP wajib membuat faktur pajak untuk setiap\npenyerahan barang atau jasa kena pajak.\n\n2. Tarif. Tarif PPN yang tercantum dalam undang-undang adalah 12%. Pada barang dan jasa\nselain barang mewah, penghitungan memakai DPP nilai lain sebesar 11/12 dari harga jual,\nsehingga beban efektifnya setara dengan 11% dari harga jual. Periksa ketentuan terbaru\nkarena kebijakan tarif dan DPP dapat berubah. Contoh di bawah memakai beban efektif\n11%.\n\n3. Mekanisme.\n\n   \\text{PPN disetor} = \\text{PPN Keluaran} - \\text{PPN Masukan}\n\n     PPN keluaran: PPN yang dipungut PKP saat menjual.\n     PPN masukan: PPN yang dibayar PKP saat membeli, yang dapat dikreditkan bila\n     memenuhi syarat (faktur pajak sah, berkaitan dengan kegiatan usaha).\n     Bila PPN keluaran lebih besar, ada kurang bayar. Bila PPN masukan lebih besar, lebih\n     bayar yang dikompensasikan ke masa berikutnya atau dimintakan restitusi.\n\nContoh. CV Berkah selama bulan Juli: penjualan kredit Rp200.000.000 (harga sebelum\nPPN), pembelian barang dagang Rp120.000.000 (harga sebelum PPN).\n\n  Uraian                    Perhitungan               Hasil (Rp)\n\n  PPN keluaran              11% × 200.000.000         22.000.000\n\n  PPN masukan               11% × 120.000.000         13.200.000\n\n  PPN kurang bayar          22.000.000 − 13.200.000   8.800.000\n\nJurnal:\n  Peristiwa                 Jurnal\n\n  Penjualan kredit          Piutang Usaha 222.000.000 (D) / Penjualan\n                            200.000.000 dan PPN Keluaran 22.000.000 (K)\n\n  Pembelian kredit          Pembelian 120.000.000 dan PPN Masukan\n                            13.200.000 (D) / Utang Usaha 133.200.000 (K)\n\n  Penyetoran PPN            PPN Keluaran 22.000.000 (D) / PPN Masukan\n                            13.200.000 dan Kas 8.800.000 (K)\n\n4. Barang dan jasa yang dikecualikan. Antara lain kebutuhan pokok tertentu, jasa\nkesehatan, jasa pendidikan, jasa keuangan, dan jasa angkutan umum. Daftar rincinya\ndiatur dalam peraturan dan dapat berubah.\n\nE. Administrasi Perpajakan\n1. Alur administrasi untuk perusahaan\n\n 1. Mendaftar dan memperoleh NPWP serta mengukuhkan PKP bila memenuhi syarat.\n 2. Menghitung pajak setiap masa.\n 3. Membuat kode billing dan membayar melalui bank, kantor pos, atau kanal pembayaran\n     resmi.\n 4. Menyimpan bukti penerimaan negara (BPN).\n 5. Membuat bukti potong atau faktur pajak untuk transaksi yang wajib.\n 6. Melaporkan SPT Masa setiap bulan dan SPT Tahunan setiap tahun.\n 7. Menyimpan buku, catatan, dan dokumen pendukung paling singkat sepuluh tahun.\n\n2. Batas waktu umum\n\n  Kewajiban                          Bayar                         Lapor\n\n  PPh 21                             Tanggal 10 bulan berikutnya   Tanggal 20 bulan berikutnya\n\n  PPh 23, 4(2)                       Tanggal 10 bulan berikutnya   Tanggal 20 bulan berikutnya\n\n  PPh 25                             Tanggal 15 bulan berikutnya   Tanggal 20 bulan berikutnya\n\n  PPh final UMKM                     Tanggal 15 bulan berikutnya   Mengikuti ketentuan SPT Masa\n\n  PPN                                Akhir bulan berikutnya        Akhir bulan berikutnya\n\n  SPT Tahunan orang pribadi                                        31 Maret\n\n  SPT Tahunan badan                                                30 April\nBila tanggal jatuh pada hari libur, batas waktu mengikuti ketentuan hari kerja berikutnya.\nBatas waktu dapat berubah.\n\n3. Sanksi administrasi. Keterlambatan lapor SPT Masa dikenai denda tetap, SPT Tahunan\ndikenai denda tetap yang lebih besar bagi badan, dan keterlambatan bayar dikenai bunga\nbulanan sesuai tingkat yang ditetapkan menteri keuangan. Kesalahan dapat diperbaiki\ndengan pembetulan SPT.\n\n4. Pembukuan dan pencatatan\n\n  Aspek                     Pembukuan                        Pencatatan\n\n  Pengguna                  Badan dan orang pribadi yang     Orang pribadi dengan omzet\n                            menjalankan usaha dengan omzet   sampai Rp4,8 miliar dan pekerja\n                            besar                            bebas\n\n  Isi                       Lengkap sampai laporan           Hanya data peredaran bruto atau\n                            keuangan                         penghasilan neto\n\n  Dasar                     Laba fiskal                      Peredaran bruto (PPh final) atau\n  penghitungan                                               norma penghitungan\n\nF. Aktivitas Praktikum\n 1. Mengisi simulasi bukti potong PPh 21 untuk tiga pegawai dengan status PTKP berbeda.\n 2. Menghitung PPN keluaran dan masukan dari sepuluh faktur dan menyusun\n     rekapitulasinya.\n 3. Mengisi kode billing dan formulir SPT Masa secara simulasi pada contoh aplikasi\n     pelatihan.\n 4. Menyusun rekonsiliasi fiskal dari laporan laba rugi komersial.\n 5. Membuat jadwal kalender pajak sebuah usaha dalam setahun.\n\nRangkuman Modul 5\n     Pajak menganut self assessment, dan sebagian pajak dipotong atau dipungut pihak\n     ketiga.\n     PPh 21 dihitung dari penghasilan neto dikurangi PTKP, lalu dikalikan tarif Pasal 17.\n     PPh final UMKM 0,5% dikenakan atas peredaran bruto. PPh badan memakai tarif 22%\n     atas laba fiskal setelah rekonsiliasi.\n     PPN disetor sebesar PPN keluaran dikurangi PPN masukan.\n     Pajak harus dibayar dengan kode billing dan dilaporkan sesuai batas waktu untuk\n     menghindari sanksi.\nLatihan Modul 5\n 1. Hitung PPh 21 setahun untuk Sari (K/1) bergaji Rp10.000.000 per bulan, tanpa iuran\n     pensiun. PTKP K/1 = 54.000.000 + 4.500.000 + 4.500.000 = 63.000.000.\n 2. Hitung PPh 23 atas jasa perbaikan alat kantor Rp5.000.000 dan buat jurnal bagi\n     pemberi jasa dan penerima jasa.\n 3. Toko Sinar beromzet Rp45.000.000 pada bulan Agustus. Hitung PPh final UMKM dan\n     buat jurnalnya.\n 4. PT Nusa: penjualan Rp150.000.000, pembelian Rp90.000.000 (keduanya sebelum PPN,\n     beban efektif 11%). Hitung PPN yang disetor dan buat jurnal ketiga transaksi.\n 5. Laba komersial PT Bintang Rp200.000.000. Koreksi positif: biaya jamuan tanpa daftar\n     nominatif 6.000.000 dan sumbangan 4.000.000. Koreksi negatif: bunga deposito\n     5.000.000. PPh 25 yang dibayar 30.000.000. Hitung penghasilan kena pajak dan PPh\n     Pasal 29.\n\nKunci Jawaban Singkat\n     Nomor 1: Bruto setahun 120.000.000. Biaya jabatan 5% = 6.000.000 (tepat batas\n     maksimum). Neto = 114.000.000. PKP = 114.000.000 − 63.000.000 = 51.000.000. PPh 21 =\n     5% × 51.000.000 = 2.550.000.\n     Nomor 2: 2% × 5.000.000 = 100.000. Penerima jasa: Beban Perbaikan 5.000.000 (D) /\n     Kas 4.900.000 dan Utang PPh 23 100.000 (K).\n     Nomor 3: 0,5% × 45.000.000 = 225.000.\n     Nomor 4: PPN keluaran = 16.500.000. PPN masukan = 9.900.000. PPN disetor =\n     6.600.000.\n     Nomor 5: PKP = 200.000.000 + 6.000.000 + 4.000.000 − 5.000.000 = 205.000.000. PPh\n     terutang 22% = 45.100.000. PPh 29 = 45.100.000 − 30.000.000 = 15.100.000.\n\nPenutup\nUrutan belajar yang disarankan: Modul 1 sampai 3 sebagai fondasi, lalu Modul 4 dan 5\nsebagai penerapan pada lembaga publik dan perpajakan. Untuk setiap modul, guru dapat\nmenambahkan studi kasus lokal, praktik memakai aplikasi akuntansi, dan asesmen\nberbasis proyek. Pastikan seluruh ketentuan hukum dan perpajakan dicek ulang terhadap\nregulasi terbaru sebelum digunakan."];

function teacherHome(){let classes=db.classes,students=db.users.filter(u=>u.role==="student"),submissions=db.submissions,upcoming=db.events;return `<div class="welcome"><div><span class="pill">DASHBOARD GURU</span><h1>Selamat datang, ${esc(current.name.split(",")[0])}! 👋</h1><p>Kelola pembelajaran akuntansi dalam satu ruang.</p></div><div class="welcomeArt">🌿📒</div></div><div class="stats"><div class="stat"><span class="icon">🏫</span><div class="label">Total kelas</div><strong>${classes.length}</strong><div class="small muted">${classes.map(c=>c.name).join(" • ")}</div></div><div class="stat"><span class="icon">📝</span><div class="label">Tugas aktif</div><strong>${db.assignments.filter(a=>a.active!==false).length}</strong><div class="small muted">aktivitas yang ditugaskan</div></div><div class="stat"><span class="icon">📥</span><div class="label">Jawaban terkumpul</div><strong>${submissions.length}</strong><div class="small muted">semua kelas</div></div><div class="stat"><span class="icon">👥</span><div class="label">Siswa aktif</div><strong>${students.length}</strong><div class="small muted">terdaftar</div></div></div><div class="sectionhead"><h2>Ringkasan per kelas</h2><button class="btn light" onclick="go('classes')">Kelola kelas</button></div><div class="grid g3">${classes.map(c=>`<div class="card"><span class="pill">${esc(c.name)}</span><h2 style="font-size:29px;margin:10px 0 0">${classUsers(c.id).length} <span class="small muted">siswa</span></h2><p class="muted">Jawaban terkumpul: ${submissions.filter(s=>classUsers(c.id).some(u=>u.id===s.userId)).length}</p><p class="muted">Siswa yang mengumpulkan: ${new Set(submissions.filter(s=>classUsers(c.id).some(u=>u.id===s.userId)).map(s=>s.userId)).size}</p><button class="btn light" onclick="go('scores')">Lihat rekap</button></div>`).join("")}</div><div class="grid g2" style="margin-top:18px"><section class="card"><div class="sectionhead" style="margin-top:0"><h2>Kegiatan mendatang</h2><button class="btn yellow" onclick function studentSafeMaterial(text){let t=String(text||"");const patterns=[/\n\s*(?:Kunci Jawaban|Kunci jawaban|Jawaban dan Pembahasan|Kunci\s*\+?\s*Pembahasan)[\s\S]*$/i,/\n\s*(?:Pedoman Penskoran|Rubrik Penilaian Guru|Kunci Guru)[\s\S]*$/i];for(const re of patterns){const m=t.match(re);if(m)t=t.slice(0,m.index)+"\n\n[Bagian kunci jawaban dan pembahasan guru tidak ditampilkan pada akun siswa.]";}return t;}
function openMaterial(id){let m=db.materials.find(x=>x.id===id);if(!m)return;activeModule=Math.max(0,db.materials.indexOf(m));let full=studentSafeMaterial(m.sourceText||m.sections.map((x,i)=>(i+1)+". "+x[0]+"\n"+x[1]).join("\n\n"));modal(`<div class="modalhead"><div><span class="pill">BAHAN AJAR LENGKAP • ${esc(m.grade)}</span><h2>${esc(m.title)}</h2></div><button class="close" onclick="closeModal()">✕</button></div><p class="muted">Sumber: ${esc(m.sourceName||"Materi Ajar Akuntansi SMK.pdf")} • Teks materi mengikuti isi modul pada PDF yang diberikan.</p><div class="notice small">Baca materi dari awal hingga latihan. Bagian materi, contoh, rangkuman, dan latihan ditampilkan untuk siswa. Kunci jawaban dan pembahasan khusus guru tidak ditampilkan pada halaman siswa.</div><div class="sourcecontent" style="white-space:pre-wrap;line-height:1.75;max-height:55vh;overflow:auto;padding:18px;background:#fffefb;border:1px solid var(--line);border-radius:13px;font-size:13px">${esc(full)}</div><div class="row" style="margin-top:14px"><button class="btn" onclick="markDone('${m.id}','read');closeModal();go('materials')">Tandai materi selesai ✓</button><button class="btn light" onclick="window.print()">Cetak materi</button></div>`)}
function teacherViewMaterial(id){let m=db.materials.find(x=>x.id===id);if(!m)return;let full=m.sourceText||m.sections.map((x,i)=>(i+1)+". "+x[0]+"\n"+x[1]).join("\n\n");modal(`<div class="modalhead"><div><span class="pill">KHUSUS GURU</span><h2>${esc(m.title)} — Materi & Kunci Jawaban</h2></div><button class="close" onclick="closeModal()">✕</button></div><div class="notice">Tampilan guru: bahan ajar lengkap termasuk bagian kunci jawaban/pembahasan yang tersedia di sumber.</div><div class="sourcecontent" style="white-space:pre-wrap;line-height:1.75;max-height:65vh;overflow:auto;padding:18px;background:#fffefb;border:1px solid var(--line);border-radius:13px;font-size:13px">${esc(full)}</div>`)}
function markDone(mid,kind){db.progress[current.id]??={};db.progress[current.id][mid]??={};db.progress[current.id][mid][kind]=true;logActivity(({read:"Menyelesaikan materi",sim:"Menyelesaikan simulasi",lkpd:"Mengumpulkan LKPD",quiz:"Menyelesaikan kuis"})[kind]+" • "+(db.materials.find(m=>m.id===mid)?.title||"Materi"));save();toast("Progres belajar diperbarui.");render()}

function quizEngine(kind){let mats=activeMaterials();let title=kind==="sim"?"Simulasi Akuntansi":"Kuis & Evaluasi";let mi=Math.min(activeModule,mats.length-1);let m=mats[mi];if(!m)return `<div class="empty">Belum ada materi aktif.</div>`;let bank=kind==="sim"?SIMS[Math.max(0,db.materials.indexOf(m))]||SIMS[0]:(QUIZZES[Math.max(0,db.materials.indexOf(m))]||QUIZZES[0]);return `<div class="sectionhead" style="margin-top:0"><div><h1>${title}</h1><p class="muted">${kind==="sim"?"5 soal praktik pilihan ganda dengan pembahasan.":"10 soal pilihan ganda dan 5 uraian singkat per modul."}</p></div></div><div class="tabrow">${mats.map((x,i)=>`<button class="tabbtn ${i===mi?"active":""}" onclick="activeModule=${i};render()">${i+1}. ${esc(x.title.split(" ").slice(0,3).join(" "))}</button>`).join("")}</div><div class="card"><span class="pill">${esc(m.grade)}</span><h2>${esc(m.title)}</h2><p class="muted">Pilih jawaban untuk setiap soal. Nilai dan pembahasan akan muncul setelah dikumpulkan.</p><div id="quizform">${bank.map((q,i)=>`<div class="question"><p>${i+1}. ${esc(q.q)}</p>${q.o?.length?q.o.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${esc(o)}</label>`).join(""):`<textarea id="essay${i}" placeholder="Tuliskan jawabanmu dengan singkat dan jelas..."></textarea>`}</div>`).join("")}</div><button class="btn yellow" onclick="submitQuiz('${kind}','${m.id}')">Kumpulkan jawaban</button> <button class="btn light" onclick="render()">Atur ulang</button><div id="quizresult"></div></div>`}
function submitQuiz(kind,mid){let m=db.materials.find(x=>x.id===mid),idx=db.materials.indexOf(m),bank=kind==="sim"?SIMS[idx]:(QUIZZES[idx]||[]),mc=bank.filter(q=>q.o?.length),essay=bank.filter(q=>!q.o?.length);let correct=0;let details=[];mc.forEach((q,i)=>{let el=document.querySelector(`input[name="q${bank.indexOf(q)}"]:checked`);let ans=el?Number(el.value):-1;if(ans===q.a)correct++;details.push(`<div class="item"><b>${ans===q.a?"✅":"❌"} ${esc(q.q)}</b><p>Jawaban benar: ${esc(q.o[q.a])}</p><p class="muted">${esc(q.why||q.e)}</p></div>`)});let score=Math.round(correct/(mc.length||1)*100);db.scores[current.id]??={};db.scores[current.id][mid]??={};db.scores[current.id][mid][kind]=score;let submission={id:uid("sub"),userId:current.id,title:(kind==="sim"?"Simulasi":"Kuis")+" • "+m.title,type:kind,score,answers:bank.map((q,i)=>({q:q.q,answer:q.o?.length?(document.querySelector(`input[name="q${i}"]:checked`)?.value??"Belum dijawab"):document.getElementById("essay"+i)?.value||""})),at:new Date().toISOString()};db.submissions.push(submission);markDone(mid,kind);let result=document.getElementById("quizresult");if(result)result.innerHTML=`<div class="success"><b>Jawaban tersimpan.</b> Nilai pilihan ganda: ${score}/100 (${correct} dari ${mc.length} benar). Uraian akan diperiksa guru / kamu dapat melihat catatan rubrik di bawah.</div>${details.join("")}${essay.map(q=>`<div class="item"><b>Uraian: ${esc(q.q)}</b><p class="muted">Rubrik: ketepatan konsep, langkah/perhitungan, dan alasan yang logis. Nilai akhir uraian diberikan guru.</p></div>`).join("")}`;save()}
function studentLKPD(){let mats=activeMaterials();return `<div class="sectionhead" style="margin-top:0"><div><h1>LKPD Praktik & Studi Kasus</h1><p class="muted">Kerjakan prosedur dan analisis masalah. Kunci jawaban tidak ditampilkan pada akun siswa.</p></div></div>${mats.map((m,i)=>{let done=db.progress[current.id]?.[m.id]?.lkpd;return `<div class="card" style="margin-bottom:14px"><div class="itemhead"><div><span class="pill">LKPD ${i+1} • ${esc(m.grade)}</span><h2>${esc(m.title)}</h2><p class="muted">${esc(m.desc)}</p></div><span>${done?"✅":"📄"}</span></div><div class="grid g2"><div class="featurebox"><b>Praktik prosedural</b><p class="muted">Ikuti langkah kerja, catat proses, dan periksa hasil tiap tahap.</p></div><div class="featurebox"><b>Studi kasus pemecahan masalah</b><p class="muted">Identifikasi masalah, gunakan data yang tersedia, lalu jelaskan alasan keputusanmu.</p></div></div><button class="btn" onclick="openLKPD('${m.id}')">Buka LKPD →</button> ${done?'<span class="pill">Sudah dikumpulkan</span>':''}</div>`}).join("")}`}
function openLKPD(mid){let m=db.materials.find(x=>x.id===mid),i=db.materials.indexOf(m);let prompts=[
["Praktik prosedural:","Diberikan transaksi: pemilik menyetor modal tunai Rp30.000.000; membeli perlengkapan kredit Rp1.200.000; menerima pendapatan jasa tunai Rp2.500.000; membayar utang Rp500.000. Susun analisis akun, jurnal umum, posting ringkas, dan cek keseimbangan debit-kredit." ,"Studi kasus:","Usaha mencatat pembelian perlengkapan sebagai beban seluruhnya, padahal sebagian masih tersisa. Jelaskan dampak pada laporan keuangan dan langkah koreksinya."],
["Praktik prosedural:","Usaha dagang memiliki persediaan awal Rp8.000.000, pembelian bersih Rp40.000.000, beban angkut Rp1.000.000, dan persediaan akhir Rp9.000.000. Hitung HPP dan tunjukkan urutan perhitungannya.","Studi kasus:","Buku penjualan dan stok fisik berbeda. Susun langkah pemeriksaan dokumen, penelusuran transaksi, dan rekomendasi pengendalian."],
["Praktik prosedural:","Aset tetap memiliki harga perolehan Rp48.000.000, nilai residu Rp8.000.000, dan umur manfaat 5 tahun. Hitung penyusutan garis lurus per tahun dan buat jurnal penyusutan.","Studi kasus:","Saldo rekening koran tidak sama dengan saldo kas menurut buku. Kelompokkan kemungkinan penyebab dan susun langkah rekonsiliasi."],
["Praktik prosedural:","Anggaran belanja kegiatan Rp200.000.000 dan realisasi Rp170.000.000. Hitung persentase realisasi, selisih, dan buat catatan ringkas untuk laporan.","Studi kasus:","Satu pengeluaran kegiatan tidak memiliki bukti pendukung yang memadai. Jelaskan risiko dan tindakan perbaikan yang perlu dilakukan."],
["Praktik prosedural:","Buat daftar pemeriksaan dokumen untuk satu transaksi penjualan barang/jasa: identitas pihak, tanggal, uraian, nilai, dan dokumen pendukung. Tunjukkan bagaimana transaksi dicatat untuk kebutuhan administrasi pajak.","Studi kasus:","Laba komersial berbeda dari laba fiskal. Jelaskan langkah awal identifikasi perbedaan dan mengapa ketentuan pajak terbaru perlu diverifikasi."]
][i]||[];modal(`<div class="modalhead"><div><span class="pill">LKPD SISWA</span><h2>${esc(m.title)}</h2></div><button class="close" onclick="closeModal()">✕</button></div><p class="muted">Nama: ${esc(current.name)} • Kelas: ${esc(userClass()?.name||"-")}</p><div class="notice">Petunjuk: jawab menggunakan langkah kerja yang jelas. Simpan jawaban akhir setelah diperiksa kembali. LKPD ini tidak menampilkan kunci jawaban.</div><form id="lkpdForm"><h3>${esc(prompts[0])}</h3><p>${esc(prompts[1])}</p><textarea id="lkpd1" required style="min-height:130px" placeholder="Tuliskan tahapan kerja, jurnal/perhitungan, dan hasil..."></textarea><h3>${esc(prompts[2])}</h3><p>${esc(prompts[3])}</p><textarea id="lkpd2" required style="min-height:130px" placeholder="Tuliskan analisis masalah dan solusi yang kamu usulkan..."></textarea><label>Refleksi singkat</label><textarea id="lkpd3" placeholder="Apa yang sudah dipahami dan bagian mana yang perlu dipelajari lagi?"></textarea><button class="btn yellow" style="margin-top:15px">Kumpulkan LKPD</button></form>`);document.getElementById("lkpdForm").onsubmit=e=>{e.preventDefault();let s={id:uid("sub"),userId:current.id,title:"LKPD • "+m.title,type:"lkpd",moduleId:mid,answers:[document.getElementById("lkpd1").value,document.getElementById("lkpd2").value,document.getElementById("lkpd3").value],score:null,at:new Date().toISOString()};db.submissions.push(s);markDone(mid,"lkpd");closeModal();toast("LKPD berhasil dikumpulkan.");render()}}
function teacherMaterials(){return `<div class="sectionhead" style="margin-top:0"><div><h1>Bahan Ajar</h1><p class="muted">Materi di sini langsung terhubung dengan halaman siswa. Tambah, ubah, aktifkan/nonaktifkan, atau hapus materi.</p></div><div class="row"><button class="btn light" onclick="document.getElementById('matImport').click()">Import JSON/CSV</button><input id="matImport" type="file" accept=".json,.csv,.txt" class="hidden" onchange="importMaterials(this)"><button class="btn yellow" onclick="materialModal()">+ Tambah materi</button></div></div><div class="notice small">Menghapus materi akan menghilangkannya dari daftar siswa. Data progres lama untuk materi tersebut tetap tersimpan sebagai riwayat lokal.</div><div class="grid g2">${db.materials.map((m,i)=>`<div class="card modulecard"><div class="moduletop"><div class="num">MATERI ${i+1} • KELAS ${esc(m.grade)}</div><h3>${esc(m.title)}</h3><p class="muted">${esc(m.desc)}</p></div><div class="modulebody"><span class="pill">${m.active?"Tampil untuk siswa":"Disembunyikan"}</span><p class="small muted">${m.sections.length} bagian materi</p><div class="row"><button class="btn light" onclick="teacherViewMaterial('${m.id}')">Lihat materi & kunci</button><button class="btn light" onclick="materialModal('${m.id}')">Edit</button><button class="btn outline" onclick="toggleMaterial('${m.id}')">${m.active?"Sembunyikan":"Tampilkan"}</button><button class="btn danger" onclick="deleteMaterial('${m.id}')">Hapus</button></div></div></div>`).join("")}</div>`}
function materialModal(id){let m=id?db.materials.find(x=>x.id===id):{title:"",grade:"X",desc:"",sections:[["Materi baru","Tuliskan uraian materi di sini."]],active:true};modal(`<div class="modalhead"><h2>${id?"Edit bahan ajar":"Tambah bahan ajar"}</h2><button class="close" onclick="closeModal()">✕</button></div><form id="materialForm"><label>Judul materi</label><input class="input" id="mtitle" required value="${esc(m.title)}"><label>Kelas</label><select id="mgrade"><option ${m.grade==="X"?"selected":""}>X</option><option ${m.grade==="X–XI"?"selected":""}>X–XI</option><option ${m.grade==="XI–XII"?"selected":""}>XI–XII</option><option ${m.grade==="X–XII"?"selected":""}>X–XII</option></select><label>Deskripsi singkat</label><textarea id="mdesc" required>${esc(m.desc)}</textarea><label>Bagian materi (satu bagian per baris, format: Judul | Uraian)</label><textarea id="msections" style="min-height:180px" required>${esc(m.sections.map(s=>s.join(" | ")).join("\n"))}</textarea><button class="btn yellow" style="margin-top:15px">Simpan materi</button></form>`);document.getElementById("materialForm").onsubmit=e=>{e.preventDefault();let sections=document.getElementById("msections").value.split("\n").filter(x=>x.trim()).map(line=>{let a=line.split("|");return [a.shift().trim(),a.join("|").trim()]});let obj={id:id||uid("m"),title:document.getElementById("mtitle").value.trim(),grade:document.getElementById("mgrade").value,desc:document.getElementById("mdesc").value.trim(),sections,active:m.active!==false,createdAt:m.createdAt||new Date().toISOString()};if(id)db.materials=db.materials.map(x=>x.id===id?obj:x);else db.materials.push(obj);save();closeModal();logActivity((id?"Mengubah":"Menambahkan")+" bahan ajar: "+obj.title);render();toast("Bahan ajar tersimpan dan tersinkron di halaman siswa.")}}
function toggleMaterial(id){let m=db.materials.find(x=>x.id===id);m.active=!m.active;save();render();toast("Status tampilan materi diperbarui.")}
function deleteMaterial(id){if(!confirm("Hapus materi ini dari daftar guru dan siswa?"))return;db.materials=db.materials.filter(x=>x.id!==id);save();render();toast("Materi dihapus.")}
function importMaterials(input){let f=input.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let text=reader.result;let items;if(f.name.toLowerCase().endsWith(".json"))items=JSON.parse(text);else items=text.split(/\r?\n/).filter(Boolean).slice(1).map(line=>{let [title,grade,desc,sections]=line.split(";");return {title,grade:grade||"X",desc:desc||"",sections:(sections||"").split("||").map(x=>x.split("|"))}});if(!Array.isArray(items))throw Error("File JSON harus berupa array materi.");items.forEach(x=>db.materials.push({id:uid("m"),title:x.title||"Materi impor",grade:x.grade||"X",desc:x.desc||"",sections:x.sections||[["Materi",x.content||"Tambahkan uraian"]],active:true,createdAt:new Date().toISOString()}));save();render();toast(items.length+" materi berhasil diimpor.")}catch(e){toast("Format file belum sesuai. Gunakan JSON array atau CSV: judul;kelas;deskripsi;bagian.")}};reader.readAsText(f)}
function modulesPage(){return `<div class="sectionhead" style="margin-top:0"><div><h1>Modul Ajar Guru</h1><p class="muted">Rancangan pembelajaran mengikuti bahan ajar yang tersedia.</p></div><button class="btn yellow" onclick="modulePlanModal()">+ Tambah rancangan</button></div>${activeMaterials().map((m,i)=>`<div class="card" style="margin-bottom:14px"><span class="pill">MODUL ${i+1} • KELAS ${esc(m.grade)}</span><h2>${esc(m.title)}</h2><p>${esc(m.desc)}</p><div class="grid g3">${[["Tujuan pembelajaran","Memahami konsep dan menerapkan prosedur akuntansi pada contoh transaksi."],["Langkah pembelajaran","Pendahuluan dan apersepsi → eksplorasi konsep → latihan terbimbing → praktik/LKPD → refleksi dan evaluasi."],["Asesmen","Diagnostik melalui tanya jawab, formatif melalui latihan, sumatif melalui kuis dan LKPD."]].map(x=>`<div class="featurebox"><b>${x[0]}</b><p class="muted">${x[1]}</p></div>`).join("")}</div></div>`).join("")}<div class="notice small">Rancangan awal ini mengikuti lima modul pada dokumen Modul Ajar Guru yang dilampirkan; guru tetap menyesuaikan CP, ATP, alokasi waktu, dan regulasi.</div>`}
function modulePlanModal(){modal(`<div class="modalhead"><h2>Tambah rancangan pembelajaran</h2><button class="close" onclick="closeModal()">✕</button></div><form id="planForm"><label>Materi terkait</label><select id="planMaterial">${activeMaterials().map(m=>`<option value="${m.id}">${esc(m.title)}</option>`).join("")}</select><label>Tujuan pembelajaran</label><textarea id="planGoal" required></textarea><label>Langkah pembelajaran</label><textarea id="planSteps" required></textarea><label>Asesmen</label><textarea id="planAssess" required></textarea><button class="btn yellow">Simpan rancangan</button></form>`);document.getElementById("planForm").onsubmit=e=>{e.preventDefault();db.plans??=[];db.plans.push({id:uid("plan"),mid:document.getElementById("planMaterial").value,goal:document.getElementById("planGoal").value,steps:document.getElementById("planSteps").value,assess:document.getElementById("planAssess").value});save();closeModal();render();toast("Rancangan disimpan.")}}
function classesPage(){return `<div class="sectionhead" style="margin-top:0"><div><h1>Kelola Kelas</h1><p class="muted">Kelola daftar siswa secara manual atau unggah file CSV dari Excel.</p></div><div class="row"><button class="btn light" onclick="downloadTemplate()">Unduh template</button><button class="btn yellow" onclick="studentModal()">+ Tambah siswa</button><button class="btn light" onclick="document.getElementById('studentImport').click()">Import Excel/CSV</button><input id="studentImport" class="hidden" type="file" accept=".csv,.txt" onchange="importStudents(this)"></div></div><div class="notice small">Kelas awal: AKL 1, AKL 2, AKL 3. Untuk file Excel, simpan dulu sebagai CSV UTF-8 dengan kolom nama, NIS, kelas, kata sandi.</div><div class="grid g3">${db.classes.map(c=>`<section class="card"><div class="itemhead"><div><span class="pill">${esc(c.name)}</span><h2 style="margin:10px 0 0">${classUsers(c.id).length} siswa</h2></div><button class="btn light" onclick="studentModal(null,'${c.id}')">+ Siswa</button></div><div class="tablewrap" style="margin-top:12px"><table style="min-width:300px"><thead><tr><th>Nama siswa</th><th>NIS</th><th></th></tr></thead><tbody>${classUsers(c.id).map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.nis)}</td><td><button class="btn danger" onclick="removeStudent('${u.id}')">×</button></td></tr>`).join("")||`<tr><td colspan="3" class="muted">Belum ada siswa.</td></tr>`}</tbody></table></div></section>`).join("")}</div>`}
function studentModal(id,cid){let u=id?getUser(id):{name:"",nis:"",classId:cid||"akl1",password:"siswa123"};modal(`<div class="modalhead"><h2>${id?"Edit siswa":"Tambah siswa"}</h2><button class="close" onclick="closeModal()">✕</button></div><form id="studentForm"><label>Nama lengkap</label><input class="input" id="sname" required value="${esc(u.name)}"><label>NIS</label><input class="input" id="snis" required value="${esc(u.nis)}"><label>Kelas</label><select id="sclass">${db.classes.map(c=>`<option value="${c.id}" ${u.classId===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select><label>Kata sandi awal</label><input class="input" id="spass" value="${esc(u.password)}" required><button class="btn yellow" style="margin-top:15px">Simpan siswa</button></form>`);document.getElementById("studentForm").onsubmit=e=>{e.preventDefault();let name=document.getElementById("sname").value.trim(),nis=document.getElementById("snis").value.trim(),classId=document.getElementById("sclass").value,password=document.getElementById("spass").value;if(db.users.some(x=>x.nis===nis&&x.id!==id)){toast("NIS sudah digunakan.");return}if(id){let old=getUser(id);db.classes.forEach(c=>c.students=c.students.filter(x=>x!==id));Object.assign(old,{name,nis,classId,password});db.classes.find(c=>c.id===classId).students.push(id)}else{let nu={id:uid("s"),name,nis,classId,password,role:"student"};db.users.push(nu);db.classes.find(c=>c.id===classId).students.push(nu.id)}save();closeModal();render();toast("Data siswa disimpan.")}}
function removeStudent(id){if(!confirm("Hapus siswa dari kelas?"))return;db.users=db.users.filter(u=>u.id!==id);db.classes.forEach(c=>c.students=c.students.filter(x=>x!==id));save();render()}
function downloadTemplate(){let blob=new Blob(["nama,nis,kelas,kata_sandi\nContoh Siswa,12345,AKL 1,siswa123\n"],{type:"text/csv;charset=utf-8"});downloadBlob(blob,"template_siswa_akunara.csv")}
function importStudents(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let lines=r.result.split(/\r?\n/).filter(Boolean);let rows=lines.slice(1);let count=0;rows.forEach(line=>{let a=line.split(/[,;]/).map(x=>x.trim().replace(/^"|"$/g,""));if(a.length<3)return;let [name,nis,klass,pass]=a;if(!name||!nis||db.users.some(u=>u.nis===nis))return;let c=db.classes.find(c=>c.name.toLowerCase()===klass.toLowerCase())||db.classes[0];let u={id:uid("s"),name,nis,classId:c.id,password:pass||"siswa123",role:"student"};db.users.push(u);c.students.push(u.id);count++});save();render();toast(count+" siswa berhasil diimpor.")};r.readAsText(f)}
function teacherLKPD(){let lk=db.assignments.filter(a=>a.type==="LKPD");return `<div class="sectionhead" style="margin-top:0"><div><h1>Aktivitas & LKPD</h1><p class="muted">Buat tugas praktik/studi kasus untuk siswa. Kunci jawaban hanya tersedia di akun guru.</p></div><button class="btn yellow" onclick="assignmentModal('LKPD')">+ Buat LKPD</button></div><div class="grid g2">${activeMaterials().map((m,i)=>`<div class="card"><span class="pill">LKPD ${i+1}</span><h2>${esc(m.title)}</h2><p class="muted">Praktik prosedural dan studi kasus pemecahan masalah.</p><button class="btn" onclick="openTeacherLKPD('${m.id}')">Lihat LKPD & kunci guru</button></div>`).join("")}</div><div class="sectionhead"><h2>LKPD/tugas yang ditugaskan</h2></div>${lk.map(a=>`<div class="item"><div class="itemhead"><div><h3>${esc(a.title)}</h3><p>${esc(a.className)} • Tenggat ${esc(a.due||"-")}</p></div><button class="btn danger" onclick="deleteAssignment('${a.id}')">Hapus</button></div><p><b>Kunci/rubrik:</b> ${esc(a.key||"Nilai berdasarkan ketepatan prosedur, perhitungan, analisis, dan alasan.")}</p></div>`).join("")||`<div class="card muted">Belum ada LKPD tambahan yang ditugaskan.</div>`}`}
function openTeacherLKPD(mid){let m=db.materials.find(x=>x.id===mid),i=db.materials.indexOf(m);let key=["Aset dan modal bertambah Rp30.000.000; perlengkapan dan utang bertambah Rp1.200.000; pendapatan menambah kas dan ekuitas; pembayaran utang mengurangi kas dan utang. Pastikan total debit = kredit.","HPP = 8 + 40 + 1 − 9 = Rp40 juta. Periksa faktur pembelian, retur, beban angkut, dan hasil stock opname.","Penyusutan = (48 − 8) ÷ 5 = Rp8 juta per tahun. Rekonsiliasi bank dilakukan dengan mencocokkan saldo bank dan buku, lalu mengidentifikasi cek beredar, setoran dalam perjalanan, biaya bank, dan kesalahan.","Realisasi = 170 ÷ 200 × 100% = 85%. Selisih anggaran = Rp30 juta; analisis berdasarkan rincian realisasi dan bukti.","Administrasi perlu memeriksa identitas, tanggal, uraian, nilai, bukti transaksi, dan aturan pajak yang berlaku. Rekonsiliasi fiskal menyesuaikan laba komersial sesuai aturan."][i]||"Periksa ketepatan konsep, perhitungan, bukti, prosedur, dan penalaran.";modal(`<div class="modalhead"><div><span class="pill">TAMPILAN GURU • KUNCI JAWABAN</span><h2>${esc(m.title)}</h2></div><button class="close" onclick="closeModal()">✕</button></div><p>${esc(m.desc)}</p><div class="featurebox"><b>Praktik prosedural – kunci/rambu penilaian</b><p>${esc(key)}</p></div><div class="featurebox" style="margin-top:12px"><b>Studi kasus – rubrik</b><p>Nilai berdasarkan identifikasi masalah (25%), penggunaan data dan prosedur (30%), ketepatan hasil (25%), serta alasan/rekomendasi (20%).</p></div><p class="muted small">LKPD utama “Siklus Akuntansi” yang dilampirkan membahas Bengkel Laptop Cermat, transaksi Mei, jurnal umum, buku besar, neraca saldo, penyesuaian, laporan keuangan, dan koreksi kesalahan pencatatan.</p><button class="btn yellow" onclick="assignmentModal('LKPD','${m.id}')">Tugaskan ke kelas</button>`)}
function teacherQuiz(){return `<div class="sectionhead" style="margin-top:0"><div><h1>Evaluasi & Kuis</h1><p class="muted">Buat kuis manual atau impor bank soal; hasil siswa tersimpan pada rekap nilai.</p></div><div class="row"><button class="btn light" onclick="document.getElementById('quizImport').click()">Import JSON</button><input id="quizImport" class="hidden" type="file" accept=".json" onchange="importQuiz(this)"><button class="btn yellow" onclick="assignmentModal('Kuis')">+ Buat evaluasi</button></div></div><div class="grid g2">${activeMaterials().map((m,i)=>`<div class="card"><span class="pill">Modul ${i+1}</span><h2>${esc(m.title)}</h2><p class="muted">Bank soal bawaan: 5 soal simulasi dan 10 soal pilihan ganda + 5 uraian pada evaluasi.</p><button class="btn light" onclick="previewQuiz(${i})">Pratinjau soal</button> <button class="btn" onclick="assignmentModal('Kuis','${m.id}')">Tugaskan kuis</button></div>`).join("")}</div><div class="sectionhead"><h2>Evaluasi yang ditugaskan</h2></div>${db.assignments.filter(a=>a.type==="Kuis").map(a=>`<div class="item"><div class="itemhead"><div><h3>${esc(a.title)}</h3><p>${esc(a.className)} • Tenggat ${esc(a.due||"-")}</p></div><button class="btn danger" onclick="deleteAssignment('${a.id}')">Hapus</button></div><p class="small muted">${esc(a.desc||"Evaluasi pilihan ganda dan uraian.")}</p></div>`).join("")||`<div class="card muted">Belum ada evaluasi yang ditugaskan.</div>`}`}
function previewQuiz(i){let m=db.materials[i],bank=SIMS[i];modal(`<div class="modalhead"><h2>Pratinjau bank soal: ${esc(m.title)}</h2><button class="close" onclick="closeModal()">✕</button></div>${bank.map((q,j)=>`<div class="item"><b>${j+1}. ${esc(q.q)}</b><p>${q.o.map((o,k)=>`${String.fromCharCode(65+k)}. ${esc(o)}`).join("<br>")}</p><p class="muted small">Kunci: ${String.fromCharCode(65+q.a)} — ${esc(q.e)}</p></div>`).join("")}`)}
function assignmentModal(type,mid){modal(`<div class="modalhead"><h2>Buat ${type}</h2><button class="close" onclick="closeModal()">✕</button></div><form id="assignForm"><label>Judul tugas</label><input class="input" id="atitle" required value="${type} ${mid?db.materials.find(m=>m.id===mid)?.title||"":""}"><label>Jenis</label><select id="atype"><option ${type==="LKPD"?"selected":""}>LKPD</option><option ${type==="Kuis"?"selected":""}>Kuis</option><option>Simulasi</option><option>Tugas</option></select><label>Materi terkait</label><select id="amid"><option value="">Semua materi</option>${activeMaterials().map(m=>`<option value="${m.id}" ${mid===m.id?"selected":""}>${esc(m.title)}</option>`).join("")}</select><label>Kelas tujuan</label><select id="aclass">${db.classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select><label>Tenggat</label><input class="input" id="adue" type="date"><label>Instruksi / deskripsi</label><textarea id="adesc" placeholder="Tulis instruksi untuk siswa"></textarea><label>Kunci jawaban / rubrik (khusus guru)</label><textarea id="akey" placeholder="Kunci tidak akan ditampilkan di akun siswa"></textarea><button class="btn yellow" style="margin-top:14px">Terbitkan tugas</button></form>`);document.getElementById("assignForm").onsubmit=e=>{e.preventDefault();let c=db.classes.find(x=>x.id===document.getElementById("aclass").value),m=db.materials.find(x=>x.id===document.getElementById("amid").value);db.assignments.push({id:uid("as"),title:document.getElementById("atitle").value,type:document.getElementById("atype").value,classId:c.id,className:c.name,moduleId:m?.id||"",moduleTitle:m?.title||"Semua materi",due:document.getElementById("adue").value,desc:document.getElementById("adesc").value,key:document.getElementById("akey").value,active:true,createdAt:new Date().toISOString()});save();closeModal();render();toast("Tugas diterbitkan untuk "+c.name+".")}}
function deleteAssignment(id){if(confirm("Hapus tugas ini?")){db.assignments=db.assignments.filter(a=>a.id!==id);save();render()}}
function importQuiz(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let a=JSON.parse(r.result);if(!Array.isArray(a))throw 0;db.customQuestions??=[];db.customQuestions.push(...a);save();toast(a.length+" soal berhasil diimpor.")}catch(e){toast("JSON harus berupa array objek soal.")}};r.readAsText(f)}
function eventModal(){modal(`<div class="modalhead"><h2>Tambah kegiatan mendatang</h2><button class="close" onclick="closeModal()">✕</button></div><form id="eventForm"><label>Nama kegiatan</label><input class="input" id="etitle" required placeholder="Contoh: Kuis Modul 1 / UTS"><label>Kelas</label><select id="eclass">${db.classes.map(c=>`<option>${esc(c.name)}</option>`).join("")}</select><label>Tanggal</label><input class="input" id="edate" type="date" required><label>Jenis kegiatan</label><select id="etype"><option>Materi</option><option>LKPD</option><option>Kuis</option><option>UTS</option><option>UAS</option><option>Tugas</option><option>Lainnya</option></select><button class="btn yellow" style="margin-top:14px">Simpan jadwal</button></form>`);document.getElementById("eventForm").onsubmit=e=>{e.preventDefault();db.events.push({id:uid("ev"),title:document.getElementById("etitle").value+" ("+document.getElementById("etype").value+")",className:document.getElementById("eclass").value,date:document.getElementById("edate").value,done:false});save();closeModal();render();toast("Jadwal kegiatan ditambahkan.")}}
function toggleEvent(id){let e=db.events.find(x=>x.id===id);if(e)e.done=!e.done;save();render()}
function scoresPages(){return ""}
function scoresPage(){let students=db.users.filter(u=>u.role==="student");let kinds=["sim","quiz","lkpd"];return `<div class="sectionhead" style="margin-top:0"><div><h1>Rekap Nilai</h1><p class="muted">Nilai di bawah 75 ditandai merah. Rata-rata dihitung dari nilai numerik yang tersedia; LKPD tanpa penilaian guru belum masuk rata-rata.</p></div><button class="btn light" onclick="exportScores()">Ekspor CSV</button></div><div class="grid g3">${db.classes.map(c=>{let us=classUsers(c.id),subs=db.submissions.filter(s=>us.some(u=>u.id===s.userId));return `<div class="card"><span class="pill">${esc(c.name)}</span><h2>${us.length} siswa</h2><p class="muted">${subs.length} jawaban terkumpul</p><p class="muted">${new Set(subs.map(s=>s.userId)).size} siswa sudah mengumpulkan</p></div>`}).join("")}</div><div class="sectionhead"><h2>Nilai per siswa</h2></div><div class="tablewrap"><table><thead><tr><th>Nama siswa</th><th>Kelas</th><th>Simulasi</th><th>Kuis</th><th>LKPD</th><th>Rata-rata</th><th>Jawaban terkumpul</th></tr></thead><tbody>${students.map(u=>{let vals=[];let sims=[],quizzes=[],lk=[];db.submissions.filter(s=>s.userId===u.id).forEach(s=>{if(s.type==="sim"&&s.score!=null)sims.push(s.score);if(s.type==="quiz"&&s.score!=null)quizzes.push(s.score);if(s.type==="lkpd"&&s.score!=null)lk.push(s.score)});vals=[...sims,...quizzes,...lk];let avg=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):null;return `<tr><td>${esc(u.name)}<div class="small muted">NIS ${esc(u.nis)}</div></td><td>${esc(db.classes.find(c=>c.id===u.classId)?.name||"-")}</td><td>${scoreCell(sims)}</td><td>${scoreCell(quizzes)}</td><td>${scoreCell(lk)}</td><td>${avg===null?"—":`<span class="${avg<75?"scorebad":"scoregood"}">${avg}</span>`}</td><td>${db.submissions.filter(s=>s.userId===u.id).length}</td></tr>`}).join("")||`<tr><td colspan="7" class="empty">Belum ada siswa.</td></tr>`}</tbody></table></div><div class="notice small">Catatan: skor pilihan ganda dihitung otomatis. LKPD perlu dinilai guru melalui pengembangan lanjutan; saat ini jawaban LKPD tersimpan tanpa nilai otomatis. Batas nilai rendah: di bawah 75.</div>`}
function scoreCell(a){if(!a.length)return "—";let n=Math.round(a.reduce((x,y)=>x+y,0)/a.length);return `<span class="${n<75?"scorebad":"scoregood"}">${n}</span> <span class="small muted">(${a.length})</span>`}
function exportScores(){let rows=[["Nama","NIS","Kelas","Simulasi","Kuis","LKPD","Rata-rata"]];db.users.filter(u=>u.role==="student").forEach(u=>{let arr=k=>db.submissions.filter(s=>s.userId===u.id&&s.type===k&&s.score!=null).map(s=>s.score);let a=[...arr("sim"),...arr("quiz"),...arr("lkpd")];rows.push([u.name,u.nis,db.classes.find(c=>c.id===u.classId)?.name||"",mean(arr("sim")),mean(arr("quiz")),mean(arr("lkpd")),mean(a)])});downloadBlob(new Blob([rows.map(r=>r.map(csv).join(",")).join("\n")],{type:"text/csv;charset=utf-8"}),"rekap_nilai_akunara.csv")}
function mean(a){return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):""}function csv(x){return '"'+String(x??"").replace(/"/g,'""')+'"'}
function assistantPage(){return `<div class="sectionhead" style="margin-top:0"><div><h1>✧ AI Asisten Akuntansi</h1><p class="muted">${isTeacher()?"Bantu merancang materi, LKPD, soal, rubrik, dan aktivitas pembelajaran.":"Tanyakan konsep yang belum dipahami berdasarkan materi akuntansi."}</p></div><span class="pill">Asisten lokal prototipe</span></div><div class="grid g2"><section class="card"><div class="chatlog" id="chatlog">${(db.chat.filter(c=>c.userId===current.id)).map(c=>`<div class="bubble ${c.role==="user"?"me":""}"><b>${c.role==="user"?"Kamu":"AKUNARA"}</b><div>${esc(c.text).replace(/\n/g,"<br>")}</div></div>`).join("")||`<div class="bubble"><b>AKUNARA</b><div>Halo! Tanyakan konsep, rumus, jurnal, atau minta bantuan menyusun aktivitas belajar. Aku akan membantu berdasarkan materi yang tersedia di prototipe ini.</div></div>`}</div><form id="chatForm" class="row" style="margin-top:12px"><input class="input" id="chatInput" placeholder="Contoh: bagaimana menghitung HPP?" required><button class="btn yellow">Kirim</button></form><p class="small muted">Catatan: jawaban saat ini memakai basis pengetahuan lokal sederhana, bukan model AI online. Jangan memasukkan data pribadi atau rahasia.</p></section><section class="card"><h2>Contoh pertanyaan</h2>${(isTeacher()?["Buat 3 pertanyaan pemantik tentang jurnal umum","Susun rubrik penilaian LKPD siklus akuntansi","Buat alur pembelajaran materi HPP","Jelaskan cara memberi umpan balik pada siswa"]:["Jelaskan persamaan dasar akuntansi dengan contoh","Bagaimana menghitung HPP perusahaan dagang?","Apa perbedaan debit dan kredit?","Jelaskan penyusutan garis lurus dengan contoh"]).map(q=>`<div class="item"><button class="btn light" style="width:100%;text-align:left" onclick="askExample('${q.replace(/'/g,"\\'")}')">${esc(q)} →</button></div>`).join("")}</section></div>`}
function answerAI(q){let s=q.toLowerCase();if(s.includes("hpp"))return "HPP perusahaan dagang = Persediaan awal + Pembelian bersih + Beban angkut pembelian − Persediaan akhir. Contoh: 10 jt + 50 jt + 2 jt − 12 jt = Rp50 juta. Pastikan setiap komponen berasal dari data periode yang sama.";if(s.includes("debit")||s.includes("kredit"))return "Cara ringkas: aset, beban, dan prive bertambah di debit; liabilitas, ekuitas, dan pendapatan bertambah di kredit. Tentukan akun yang terpengaruh, kelompok akun, apakah bertambah/berkurang, lalu pilih sisi debit-kredit. Total debit harus sama dengan total kredit.";if(s.includes("persamaan"))return "Persamaan dasar akuntansi adalah Aset = Liabilitas + Ekuitas. Misalnya aset Rp80 juta dan liabilitas Rp30 juta, maka ekuitas = Rp80 juta − Rp30 juta = Rp50 juta. Persamaan harus tetap seimbang setelah transaksi.";if(s.includes("penyusutan"))return "Metode garis lurus: Penyusutan per tahun = (Harga perolehan − Nilai residu) ÷ Umur manfaat. Misalnya harga Rp24 juta, residu Rp4 juta, umur 5 tahun: (24 − 4) ÷ 5 = Rp4 juta per tahun.";if(s.includes("jurnal"))return "Langkah jurnal umum: (1) baca bukti transaksi; (2) tentukan akun yang terpengaruh; (3) tentukan kelompok dan perubahan akun; (4) tentukan debit/kredit; (5) tulis tanggal, akun, referensi, debit, kredit; (6) cek total debit = total kredit.";if(s.includes("rubrik"))return "Contoh rubrik LKPD: ketepatan konsep 25%, urutan prosedur 25%, ketepatan perhitungan/hasil 25%, analisis dan alasan 15%, kerapian serta bukti pendukung 10%. Sesuaikan dengan tujuan pembelajaran dan instruksi tugas.";if(s.includes("pemantik")||s.includes("pertanyaan"))return "Contoh pertanyaan pemantik: (1) Mengapa transaksi harus didukung bukti? (2) Apa akibatnya jika pembelian kredit dicatat sebagai pembelian tunai? (3) Bagaimana memastikan jurnal tetap seimbang? Minta siswa menjelaskan alasan, bukan hanya menyebut jawaban.";if(s.includes("pajak")||s.includes("ppn")||s.includes("pph"))return "Untuk materi pajak, identifikasi jenis pajak dan objeknya, pihak yang terlibat, dokumen pendukung, dasar pengenaan, serta periode pelaporan. Tarif, batasan, dan prosedur bisa berubah; verifikasi aturan resmi terbaru sebelum membuat keputusan atau menghitung pajak nyata.";if(s.includes("apbdes")||s.includes("pemerintah"))return "Dalam akuntansi lembaga pemerintah, perhatikan anggaran, realisasi, bukti transaksi, penatausahaan, dan pelaporan. Persentase realisasi = Realisasi ÷ Anggaran × 100%. Selisih harus dianalisis berdasarkan dokumen dan konteks kegiatan.";if(isTeacher())return "Untuk menyusun pembelajaran, mulailah dari tujuan yang terukur, materi inti, contoh kontekstual, latihan terbimbing, praktik/LKPD, asesmen, lalu refleksi. Saya bisa membantu membuat draf, tetapi sesuaikan kembali dengan CP/ATP, karakteristik kelas, dan kebijakan sekolah.";return "Coba kaitkan pertanyaanmu dengan materi yang sedang dipelajari. Kamu bisa menanyakan persamaan dasar, jurnal umum, HPP, piutang, persediaan, aset tetap, akuntansi pemerintah, atau administrasi pajak. Untuk perhitungan, kirim angka lengkap dan tuliskan apa yang diminta."}
function sendChat(e){e.preventDefault();let input=document.getElementById("chatInput"),q=input.value.trim();if(!q)return;db.chat.push({userId:current.id,role:"user",text:q,at:new Date().toISOString()});db.chat.push({userId:current.id,role:"assistant",text:answerAI(q),at:new Date().toISOString()});db.chat=db.chat.slice(-100);save();render()}
function askExample(q){db.chat.push({userId:current.id,role:"user",text:q,at:new Date().toISOString()},{userId:current.id,role:"assistant",text:answerAI(q),at:new Date().toISOString()});save();render()}
function studentProgress(){let mats=activeMaterials(),p=db.progress[current.id]||{};return `<div class="sectionhead" style="margin-top:0"><div><h1>Progres Belajar</h1><p class="muted">Setiap materi memiliki empat aktivitas: baca materi, simulasi, LKPD, dan kuis. Setiap aktivitas yang selesai menyumbang bagian progres.</p></div></div><div class="card"><div class="itemhead"><div><div class="muted">Progres keseluruhan</div><h2 style="font-size:40px;margin:0">${progressFor(current.id)}%</h2></div><div style="font-size:42px">🌱</div></div><div class="progress" style="height:13px"><span style="width:${progressFor(current.id)}%"></span></div><p class="muted small">${doneCount(current.id)} aktivitas selesai dari ${mats.length*4} aktivitas aktif.</p></div><div class="sectionhead"><h2>Progres per materi</h2></div>${mats.map((m,i)=>{let x=p[m.id]||{},n=["read","sim","lkpd","quiz"].filter(k=>x[k]).length;return `<div class="card" style="margin-bottom:12px"><div class="itemhead"><div><span class="pill">Materi ${i+1}</span><h3 style="margin-top:8px">${esc(m.title)}</h3></div><b>${Math.round(n/4*100)}%</b></div><div class="progress"><span style="width:${n/4*100}%"></span></div><div class="row">${[["read","Materi"],["sim","Simulasi"],["lkpd","LKPD"],["quiz","Kuis"]].map(([k,t])=>`<span class="pill" style="${x[k]?"background:#dff1df":"background:#f0f2eb;color:#7a8d7e"}">${x[k]?"✓":"○"} ${t}</span>`).join("")}</div></div>`}).join("")}` }
function notificationsPage(){let ass=db.assignments.filter(a=>!a.classId||!isTeacher()||true);if(!isTeacher())ass=ass.filter(a=>a.classId===current.classId);return `<div class="sectionhead" style="margin-top:0"><div><h1>Notifikasi</h1><p class="muted">${isTeacher()?"Pengingat kegiatan dan aktivitas kelas.":"Materi, simulasi, LKPD, dan kuis yang perlu diperhatikan."}</p></div></div>${isTeacher()?`<div class="card"><div class="itemhead"><div><h2>Pengingat kegiatan mendatang</h2><p class="muted">Buat checklist materi, tugas, UTS, atau UAS per kelas.</p></div><button class="btn yellow" onclick="eventModal()">+ Jadwalkan</button></div>${db.events.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div class="checkrow"><input type="checkbox" ${e.done?"checked":""} onchange="toggleEvent('${e.id}')"><div><b>${esc(e.title)}</b><div class="small muted">${esc(e.className)} • ${esc(e.date)}</div></div><button class="btn danger" onclick="deleteEvent('${e.id}')">Hapus</button></div>`).join("")||`<div class="empty">Belum ada kegiatan yang dijadwalkan.</div>`}</div>`:`${activeMaterials().map((m,i)=>{let p=db.progress[current.id]?.[m.id]||{};return `<div class="item"><div class="itemhead"><div><h3>Materi ${i+1}: ${esc(m.title)}</h3><p>${p.read?"Sudah dipelajari":"Materi belum ditandai selesai"}</p></div><button class="btn light" onclick="openMaterial('${m.id}')">Buka</button></div><div class="row" style="margin-top:8px">${[["sim","Simulasi"],["lkpd","LKPD"],["quiz","Kuis"]].map(([k,t])=>`<span class="pill">${p[k]?"✓":"○"} ${t}</span>`).join("")}</div></div>`}).join("")}${ass.map(a=>`<div class="item"><div class="itemhead"><div><span class="pill">TUGAS BARU</span><h3 style="margin-top:6px">${esc(a.title)}</h3><p>${esc(a.type)} • ${esc(a.className)} • Tenggat ${esc(a.due||"belum ditentukan")}</p></div><button class="btn yellow" onclick="go('${a.type==="Kuis"?"quiz":"lkpd"}')">Lihat tugas</button></div><p>${esc(a.desc||"Periksa instruksi dan selesaikan sesuai tenggat.")}</p></div>`).join("")}`}`}
function deleteEvent(id){db.events=db.events.filter(e=>e.id!==id);save();render()}
function settingsPage(){return `<div class="sectionhead" style="margin-top:0"><div><h1>Pengaturan</h1><p class="muted">Atur profil, kata sandi, notifikasi, tampilan, bantuan, dan akun.</p></div></div><div class="grid g2"><section class="card"><h2>Profil</h2><label>Nama lengkap</label><input class="input" id="profName" value="${esc(current.name)}"><label>${isTeacher()?"NIP":"NIS"}</label><input class="input" id="profNis" value="${esc(current.nis)}"><label>Kelas</label><input class="input" value="${isTeacher()?"Guru Akuntansi":esc(userClass()?.name||"-")}" disabled><button class="btn" style="margin-top:12px" onclick="saveProfile()">Simpan profil</button></section><section class="card"><h2>Kata sandi</h2><label>Kata sandi lama</label><input class="input" type="password" id="oldPass"><label>Kata sandi baru</label><input class="input" type="password" id="newPass"><button class="btn" style="margin-top:12px" onclick="changePassword()">Ubah kata sandi</button></section><section class="card"><h2>Notifikasi</h2><p class="muted">Tampilkan pengingat tugas dan aktivitas pembelajaran.</p><label class="checkrow"><input type="checkbox" id="notifSetting" ${db.settings.notifications?"checked":""}> Aktifkan notifikasi di aplikasi</label><button class="btn" onclick="saveSettings()">Simpan</button></section><section class="card"><h2>Tampilan</h2><label>Tema</label><select id="themeSetting"><option value="light" ${db.settings.theme!=="dark"?"selected":""}>Terang — sage & butter yellow</option><option value="dark" ${db.settings.theme==="dark"?"selected":""}>Gelap</option></select><button class="btn" style="margin-top:12px" onclick="saveSettings()">Terapkan tampilan</button></section><section class="card"><h2>Bantuan</h2><p class="muted">Jika ada masalah, periksa isian, gunakan akun demo, dan pastikan browser mengizinkan penyimpanan lokal. Data prototipe tersimpan pada perangkat/browser yang sama.</p><button class="btn light" onclick="showHelp()">Panduan singkat</button></section><section class="card"><h2>Keluar akun</h2><p class="muted">Akhiri sesi AKUNARA pada perangkat ini.</p><button class="btn danger" onclick="logout()">Keluar</button></section></div><div class="notice small">Keamanan prototipe: kata sandi demo disimpan lokal dan bukan sistem autentikasi aman. Untuk pemakaian sekolah nyata, perlu backend/database, autentikasi, dan kontrol akses server.</div>`}
function saveProfile(){let name=document.getElementById("profName").value.trim(),nis=document.getElementById("profNis").value.trim();if(!name||!nis)return toast("Nama dan nomor identitas harus diisi.");if(db.users.some(u=>u.nis===nis&&u.id!==current.id))return toast("NIS/NIP sudah dipakai.");current.name=name;current.nis=nis;save();render();toast("Profil diperbarui.")}
function changePassword(){let old=document.getElementById("oldPass").value,nw=document.getElementById("newPass").value;if(old!==current.password)return toast("Kata sandi lama tidak sesuai.");if(nw.length<6)return toast("Kata sandi baru minimal 6 karakter.");current.password=nw;save();toast("Kata sandi diubah.")}
function saveSettings(){db.settings.notifications=document.getElementById("notifSetting").checked;db.settings.theme=document.getElementById("themeSetting").value;save();render();toast("Pengaturan disimpan.")}
function showHelp(){modal(`<div class="modalhead"><h2>Panduan AKUNARA</h2><button class="close" onclick="closeModal()">✕</button></div><ol><li>Masuk memakai akun demo atau akun siswa yang dibuat guru.</li><li>Siswa membuka materi, menyelesaikan simulasi, mengerjakan LKPD, dan kuis.</li><li>Guru menambah bahan ajar; materi aktif otomatis muncul pada akun siswa di browser ini.</li><li>Guru menambah siswa manual atau mengimpor CSV yang diekspor dari Excel.</li><li>Ekspor rekap nilai dari menu Rekap Nilai.</li></ol><p class="notice">Versi HTML ini memakai localStorage. Data tidak otomatis terkirim antarperangkat atau antarbrowser.</p>`)}
function logout(){current=null;page="home";render()}
function modal(content){document.getElementById("modalRoot").innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">${content}</div></div>`}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function downloadBlob(blob,name){let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
function exportData(){downloadBlob(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),"akunara_backup.json")}
function restoreData(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.users||!x.materials||!x.classes)throw 0;db=x;save();render();toast("Cadangan berhasil dipulihkan.")}catch(e){toast("File cadangan tidak valid.")}};r.readAsText(f)}
function goSettingsTools(){return `<div class="item"><button class="btn light" onclick="exportData()">Unduh cadangan data JSON</button> <button class="btn light" onclick="document.getElementById('restoreFile').click()">Pulihkan cadangan</button><input id="restoreFile" class="hidden" type="file" accept=".json" onchange="restoreData(this)"></div>`}
const originalSettings=settingsPage;settingsPage=function(){return originalSettings()+goSettingsTools()}
window.addEventListener("submit",e=>{if(e.target.id==="chatForm")sendChat(e)});
render();
</script>
</body></html>
