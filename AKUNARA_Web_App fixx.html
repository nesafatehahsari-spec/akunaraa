20px 14px;border-right:1px solid var(--line);background:#fbfcf5}.userbox{display:flex;align-items:center;gap:10px;padding:12px;margin-bottom:14px;background:#f0f5e9;border-radius:14px}.avatar{width:38px;height:38px;border-radius:50%;background:#f5dca7;display:grid;place-items:center;font-size:21px}.navbtn{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:#547567;text-align:left;padding:11px 12px;border-radius:11px;margin:3px 0}.navbtn.active,.navbtn:hover{background:#dfebd4;color:#245e4c;font-weight:800}.navbtn .ico{width:20px;text-align:center;font-size:17px}main{padding:26px;min-width:0}.welcome{display:flex;align-items:center;justify-content:space-between;gap:18px;background:linear-gradient(110deg,#fffef8,#edf5df);padding:24px;border-radius:20px;border:1px solid var(--line);margin-bottom:18px}.welcome h1{font-size:27px;margin:0 0 5px}.welcome p{margin:0;color:var(--muted)}.welcomeArt{font-size:58px;line-height:1}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}.stat{padding:16px;border:1px solid var(--line);border-radius:15px;background:var(--card)}.stat .label{font-size:12px;color:var(--muted)}.stat strong{font-size:25px;display:block;margin-top:6px}.stat .icon{float:right;font-size:22px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 12px}.sectionhead h2{margin:0;font-size:19px}.item{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fffefb;margin:9px 0}.itemhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.item h3{margin:0 0 5px;font-size:15px}.item p{margin:3px 0;color:var(--muted)}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.progress{height:8px;background:#e9efe5;border-radius:999px;overflow:hidden;margin:10px 0}.progress span{height:100%;display:block;background:linear-gradient(90deg,#69a77d,#a8c76e);border-radius:999px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px;background:#fffefb}table{border-collapse:collapse;width:100%;min-width:600px}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#f1f6e9;font-size:12px;color:#4f7562}tr:last-child td{border-bottom:0}.scorebad{color:#c83e3e;font-weight:800}.scoregood{color:#2d855b;font-weight:800}.empty{text-align:center;padding:28px;color:var(--muted)}.modulecard{padding:0;overflow:hidden}.moduletop{padding:17px;background:linear-gradient(135deg,#f5f8e8,#e5f1df);border-bottom:1px solid var(--line)}.modulebody{padding:17px}.moduletop .num{font-size:12px;color:#6e8b70}.moduletop h3{margin:5px 0}.modalback{position:fixed;inset:0;background:#163d2e66;z-index:20;display:grid;place-items:center;padding:18px}.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:20px;padding:22px;box-shadow:0 20px 70px #1234}.modalhead{display:flex;justify-content:space-between;gap:12px;align-items:center}.close{border:0;background:#edf4e8;border-radius:10px;padding:7px 12px}.loginpage{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;gap:24px;align-items:center;padding:5vw;background:linear-gradient(130deg,#f4f7e9,#e7f2e4)}.loginhero{padding:30px;max-width:620px}.loginhero h1{font:700 clamp(36px,5vw,62px)/1.04 Georgia;margin:24px 0 14px}.loginhero p{font-size:16px;color:#6c8878;max-width:460px}.heroillustration{font-size:110px;margin-top:25px}.loginbox{max-width:460px;width:100%;justify-self:center;padding:28px}.rolepick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.rolepick button{padding:12px;border:1px solid var(--line);background:white;border-radius:12px;color:var(--ink)}.rolepick button.chosen{background:#e2efdb;border-color:#7ba886;font-weight:800}.tabrow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabbtn{border:1px solid var(--line);background:white;padding:9px 12px;border-radius:10px;color:var(--ink)}.tabbtn.active{background:#e4 {title:"Dasar-Dasar Akuntansi dan Keuangan Lembaga",grade:"X",desc:"Konsep akuntansi, persamaan dasar, jenis perusahaan, debit-kredit, dan bukti transaksi.",sections:[["Konsep dasar akuntansi","Akuntansi adalah proses mengidentifikasi, mencatat, menggolongkan, meringkas, melaporkan, dan menafsirkan transaksi keuangan sebagai dasar pengambilan keputusan."],["Persamaan dasar","Aset = Liabilitas + Ekuitas. Persamaan harus tetap seimbang setelah setiap transaksi."],["Jenis perusahaan","Perusahaan jasa menjual layanan; perusahaan dagang membeli barang jadi untuk dijual kembali; perusahaan manufaktur mengolah bahan baku menjadi barang jadi."],["Debit dan kredit","Aset, beban, dan prive bertambah di debit. Liabilitas, ekuitas, dan pendapatan bertambah di kredit."],["Bukti transaksi","Faktur/invoice, nota/struk, kuitansi, nota debit/kredit, bukti transfer, memo, serta bukti kas masuk/keluar."]]},
{title:"Akuntansi Perusahaan Jasa, Dagang, dan Manufaktur",grade:"X–XI",desc:"Siklus akuntansi, jurnal, buku besar, penyesuaian, laporan keuangan, HPP.",sections:[["Siklus akuntansi","Transaksi → bukti transaksi → jurnal → buku besar → neraca saldo → penyesuaian → laporan keuangan → jurnal penutup."],["Jurnal dan buku besar","Jurnal umum mencatat transaksi secara kronologis. Posting memindahkan nilai debit dan kredit ke akun buku besar untuk mengetahui saldo setiap akun."],["Penyesuaian","Penyesuaian dilakukan pada akhir periode untuk perlengkapan terpakai, beban dibayar di muka, penyusutan, pendapatan diterima di muka, serta beban yang masih harus dibayar."],["Laporan keuangan","Laporan laba rugi, perubahan modal, posisi keuangan/neraca, dan arus kas menyajikan kondisi serta kinerja usaha."],["HPP","Perusahaan dagang: HPP = Persediaan awal + Pembelian bersih + Beban angkut pembelian − Persediaan akhir. Perusahaan manufaktur menghitung biaya bahan baku, tenaga kerja langsung, dan overhead pabrik."]]},
{title:"Akuntansi Keuangan",grade:"XI–XII",desc:"Kas, piutang, persediaan, aset tetap, dan liabilitas.",sections:[["Kas dan rekonsiliasi bank","Kas dicatat berdasarkan bukti yang sah. Rekonsiliasi bank menjelaskan perbedaan saldo kas menurut catatan perusahaan dan rekening koran bank."],["Piutang","Piutang adalah hak tagih kepada pihak lain. Perusahaan perlu menilai kemungkinan tidak tertagih dan mencatat estimasi kerugian piutang sesuai metode yang digunakan."],["Persediaan","FIFO mengasumsikan unit yang pertama masuk menjadi unit pertama yang dijual. Metode penilaian harus diterapkan konsisten sesuai kebijakan dan standar yang berlaku."],["Aset tetap","Penyusutan garis lurus per tahun = (Harga perolehan − Nilai residu) ÷ Umur manfaat."],["Liabilitas","Liabilitas adalah kewajiban kini kepada pihak lain, misalnya utang usaha, utang gaji, dan wesel bayar. Perhatikan jatuh tempo dan pengakuan bunga."]]},
{title:"Praktikum Akuntansi Lembaga/Instansi Pemerintah",grade:"XI–XII",desc:"Akuntansi pemerintah, APBDes, penatausahaan, dan pelaporan.",sections:[["Karakteristik","Akuntansi lembaga pemerintah berfokus pada pertanggungjawaban penggunaan sumber daya publik, kepatuhan anggaran, transparansi, dan pelaporan."],["APBDes","Anggaran Pendapatan dan Belanja Desa memuat rencana pendapatan, belanja, dan pembiayaan desa sesuai ketentuan yang berlaku."],["Penatausahaan","Pencatatan penerimaan dan pengeluaran perlu didukung bukti yang sah, dicatat secara tertib, dan dapat ditelusuri."],["Pelaporan","Laporan digunakan untuk mempertanggungjawabkan pelaksanaan anggaran dan mendukung pengawasan."],["Analisis anggaran","Persentase realisasi = Realisasi ÷ Anggaran × 100%. Selisih anggaran perlu dianalisis berdasarkan konteks, bukan hanya dihitung."]]},
{title:"Administrasi Pajak dan Akuntansi Perpajakan",grade:"XI–XII",desc:"Dasar pajak, PPh, PPN, administrasi, dan rekonsiliasi fiskal.",sections:[["Konsep pajak","Pajak adalah kontribusi wajib berdasarkan undang-undang yang digunakan untuk keperluan negara. Administrasi pajak perlu tertib dan didukung dokumen."],["PPh","Pajak Penghasilan dikenakan atas objek penghasilan sesuai subjek, dasar pengenaan, fasilitas, dan ketentuan yang berlaku."],["PPN","Pajak Pertambahan Nilai berkaitan dengan penyerahan barang/jasa kena pajak sesuai ketentuan. Periksa status pihak, objek, dokumen, dan aturan terbaru."],["Administrasi","Dokumen pajak, pencatatan transaksi, pelaporan, dan tenggat harus dikelola dengan teliti."],["Rekonsiliasi fiskal","Rekonsiliasi fiskal menjembatani laba komersial dengan laba fiskal melalui koreksi sesuai ketentuan pajak. Tarif dan aturan wajib diperiksa kembali sebelum digunakan."]]}
];
const SOURCE_TEXTS=["Modul 1. Dasar-Dasar Akuntansi & Keuangan Lembaga\n\nTujuan Pembelajaran\nSetelah mempelajari modul ini, peserta didik mampu:\n\n 1. Menjelaskan pengertian, fungsi, dan pengguna informasi akuntansi.\n 2. Menerapkan persamaan dasar akuntansi pada transaksi sederhana.\n 3. Membedakan jenis-jenis perusahaan berdasarkan kegiatan usaha dan bentuk badan\n      hukumnya.\n 4. Menerapkan mekanisme debit-kredit pada akun-akun.\n 5. Mengidentifikasi dan menganalisis bukti transaksi (nota, kuitansi, invoice, dan lainnya).\nA. Konsep Dasar Akuntansi\nAkuntansi adalah proses mengidentifikasi, mencatat, menggolongkan, meringkas, dan\nmelaporkan transaksi keuangan suatu entitas, lalu menafsirkan hasilnya sebagai dasar\npengambilan keputusan.\n\nSiklus kerja akuntansi secara ringkas: transaksi → bukti transaksi → jurnal → buku besar\n→ neraca saldo → penyesuaian → laporan keuangan → penutupan.\n\nPengguna informasi akuntansi\n\n  Pengguna                     Kebutuhan informasi\n\n  Pemilik                      Laba, perkembangan modal\n\n  Manajer                      Dasar perencanaan dan pengendalian\n\n  Kreditur / bank              Kemampuan membayar utang\n\n  Pemerintah / kantor pajak    Dasar penghitungan pajak\n\n  Karyawan                     Stabilitas usaha dan kesejahteraan\n\nAsumsi dan prinsip dasar yang perlu dipahami siswa:\n\n     Entitas bisnis: harta pribadi pemilik terpisah dari harta usaha.\n     Kesatuan moneter: hanya transaksi yang dapat dinyatakan dalam uang yang dicatat.\n     Periode akuntansi: laporan disusun per periode (bulanan, tahunan).\n     Kelangsungan usaha (going concern): usaha dianggap berjalan terus.\n     Biaya historis: aset dicatat sebesar harga perolehan.\n     Basis akrual: pendapatan dicatat saat diperoleh dan beban saat terjadi, bukan saat kas\n     diterima atau dibayar.\n\nB. Persamaan Dasar Akuntansi\n\n   \\text{Aset} = \\text{Liabilitas} + \\text{Ekuitas (Modal)}\n\n     Aset: sumber daya yang dikuasai perusahaan dan memberi manfaat ekonomi di masa\n     depan, misalnya kas, piutang, perlengkapan, peralatan, kendaraan, gedung.\n     Liabilitas: kewajiban membayar kepada pihak luar, misalnya utang usaha, utang bank,\n     utang gaji.\n     Ekuitas: hak pemilik atas aset setelah dikurangi liabilitas.\n\nPersamaan yang diperluas:\n   \\text{Aset} = \\text{Liabilitas} + \\text{Modal Awal} + \\text{Pendapatan} -\n   \\text{Beban} - \\text{Prive}\n\nContoh. Pada 1 Maret, Tuan Raka mendirikan usaha jasa fotokopi dengan setoran modal\nRp50.000.000.\n\n  No          Transaksi                        Aset                    Liabilitas        Ekuitas\n\n  1           Setoran modal tunai              Kas +50.000.000                           Modal\n              Rp50.000.000                                                               +50.000.000\n\n  2           Membeli mesin fotokopi           Kas −20.000.000;\n              tunai Rp20.000.000               Peralatan\n                                               +20.000.000\n\n  3           Membeli kertas dan               Perlengkapan            Utang usaha\n              tinta secara kredit              +3.000.000              +3.000.000\n              Rp3.000.000\n\n  4           Pendapatan jasa tunai            Kas +4.000.000                            Pendapatan\n              Rp4.000.000                                                                +4.000.000\n\n  5           Membayar gaji                    Kas −1.500.000                            Beban gaji\n              Rp1.500.000                                                                −1.500.000\n\nSetelah kelima transaksi: Aset = 32.500.000 (kas) + 20.000.000 (peralatan) + 3.000.000\n(perlengkapan) = Rp55.500.000. Liabilitas + Ekuitas = 3.000.000 + (50.000.000 +\n4.000.000 − 1.500.000) = Rp55.500.000. Persamaan tetap seimbang.\n\nC. Jenis-Jenis Perusahaan\n1. Berdasarkan kegiatan usaha\n\n  Jenis                     Ciri utama                                     Contoh\n\n  Jasa                      Menjual layanan, tidak ada persediaan          Salon, bengkel, kursus,\n                            barang dagang                                  konsultan\n\n  Dagang                    Membeli barang jadi lalu menjual kembali       Toko, minimarket, distributor\n                            tanpa mengubah bentuk\n\n  Manufaktur                Mengolah bahan baku menjadi barang jadi        Pabrik roti, konveksi, mebel\n                            lalu menjual\n\n2. Berdasarkan kepemilikan dan bentuk badan usaha\n      Perusahaan perseorangan: dimiliki satu orang, mudah didirikan, tanggung jawab tidak\n      terbatas.\n      Persekutuan (Firma dan CV): dimiliki dua orang atau lebih. Pada CV ada sekutu aktif\n      dan sekutu pasif.\n      Perseroan Terbatas (PT): badan hukum, modal terbagi atas saham, tanggung jawab\n      pemegang saham terbatas pada modal yang disetor.\n      Koperasi: badan usaha beranggotakan orang atau badan hukum koperasi berdasarkan\n      asas kekeluargaan.\n      BUMN dan BUMD: badan usaha milik negara dan milik daerah.\n\n3. Lembaga nirlaba dan pemerintah. Lembaga nirlaba (yayasan, organisasi sosial) dan\ninstansi pemerintah (desa, dinas, sekolah negeri) tidak bertujuan mencari laba.\nPelaporannya mengikuti standar tersendiri dan dibahas lebih lanjut di Modul 4.\n\nD. Akun dan Mekanisme Debit-Kredit\nAkun adalah tempat mencatat perubahan satu pos, misalnya akun Kas atau akun Utang\nUsaha. Bentuk paling sederhana adalah akun T: sisi kiri debit, sisi kanan kredit.\n\nKelompok akun dan saldo normalnya\n\n  Kelompok                      Bertambah di   Berkurang di   Saldo normal\n\n  Aset                          Debit          Kredit         Debit\n\n  Beban                         Debit          Kredit         Debit\n\n  Prive                         Debit          Kredit         Debit\n\n  Liabilitas                    Kredit         Debit          Kredit\n\n  Ekuitas (Modal)               Kredit         Debit          Kredit\n\n  Pendapatan                    Kredit         Debit          Kredit\n\nCara mudah mengingat: akun yang berada di sisi kiri persamaan (aset) dan akun yang\nmengurangi ekuitas (beban, prive) bertambah di debit. Akun yang berada di sisi kanan\n(liabilitas, ekuitas) dan yang menambah ekuitas (pendapatan) bertambah di kredit.\n\nKode akun (contoh sederhana)\n\n  Kepala kode               Kelompok\n\n  1                         Aset\n\n  2                         Liabilitas\n  Kepala kode               Kelompok\n\n  3                         Ekuitas\n\n  4                         Pendapatan\n\n  5                         Beban\n\nLangkah analisis transaksi\n\n 1. Tentukan akun apa saja yang terpengaruh.\n 2. Tentukan kelompok masing-masing akun.\n 3. Tentukan bertambah atau berkurang.\n 4. Tentukan sisi debit atau kredit sesuai tabel di atas.\n 5. Pastikan jumlah debit sama dengan jumlah kredit.\n\nContoh. Transaksi: Membayar sewa kios tunai Rp2.000.000.\n\n      Beban Sewa (beban) bertambah, maka didebit Rp2.000.000.\n      Kas (aset) berkurang, maka dikredit Rp2.000.000.\n\n   Beban Sewa               Rp2.000.000\n            Kas                            Rp2.000.000\n\nE. Bukti Transaksi\nBukti transaksi adalah dokumen sumber yang menjadi dasar pencatatan. Tanpa bukti,\ncatatan akuntansi tidak dapat dipertanggungjawabkan.\n\n  Bukti                       Fungsi                          Pihak yang      Contoh penggunaan\n                                                              membuat\n\n  Faktur /                    Tagihan atas penjualan kredit   Penjual         Penjualan barang\n  Invoice                                                                     secara kredit\n\n  Nota / Struk                Bukti penjualan tunai           Penjual         Belanja di toko\n\n  Kuitansi                    Bukti penerimaan uang           Penerima uang   Pembayaran sewa,\n                                                                              pelunasan piutang\n\n  Nota debit                  Pemberitahuan pengurangan       Pembeli atau    Retur pembelian\n                              utang atau tambahan tagihan     penjual\n\n  Nota kredit                 Pemberitahuan pengurangan       Penjual         Retur penjualan\n                              piutang\n  Bukti                     Fungsi                           Pihak yang   Contoh penggunaan\n                                                             membuat\n\n  Cek / Bilyet              Perintah bayar melalui bank      Pemilik      Pembayaran ke\n  giro                                                       rekening     pemasok\n\n  Bukti setoran /           Bukti uang disetor atau          Bank         Setoran kas ke bank\n  transfer                  dipindahkan\n\n  Memo                      Bukti internal untuk transaksi   Perusahaan   Penyesuaian, koreksi\n                            non-kas\n\n  Bukti kas                 Bukti internal penerimaan        Bagian kas   Dasar jurnal kas\n  masuk / keluar            dan pengeluaran kas\n\nUnsur yang perlu ada pada bukti transaksi: nama dan alamat pihak yang terlibat, tanggal,\nnomor dokumen, uraian transaksi, jumlah dan harga, total, serta tanda tangan atau cap bila\ndiperlukan. Kuitansi dengan nominal tertentu dikenai bea meterai sesuai ketentuan yang\nberlaku.\n\nContoh analisis. Sebuah faktur nomor 045 tanggal 5 Mei menyatakan CV Maju menjual 10\ndus kertas HVS @Rp60.000 kepada UD Karya dengan pembayaran 30 hari. Artinya bagi CV\nMaju terjadi penjualan kredit Rp600.000 (Piutang Usaha di debit, Penjualan di kredit). Bagi\nUD Karya terjadi pembelian kredit (Pembelian di debit, Utang Usaha di kredit).\n\nRangkuman Modul 1\n     Persamaan dasar akuntansi: Aset = Liabilitas + Ekuitas, dan harus selalu seimbang.\n     Perusahaan dibedakan menurut kegiatan usaha (jasa, dagang, manufaktur) dan bentuk\n     badan usahanya.\n     Aset, beban, dan prive bersaldo normal debit. Liabilitas, ekuitas, dan pendapatan\n     bersaldo normal kredit.\n     Setiap pencatatan wajib didukung bukti transaksi.\n\nLatihan Modul 1\n 1. Tuliskan persamaan dasar akuntansi dan jelaskan arti masing-masing unsurnya.\n 2. Analisis pengaruh transaksi berikut terhadap persamaan dasar: (a) pemilik menyetor\n     modal Rp30.000.000; (b) membeli perlengkapan kredit Rp1.200.000; (c) menerima\n     pendapatan jasa Rp2.500.000 tunai; (d) membayar utang usaha Rp1.200.000; (e)\n     pemilik mengambil kas Rp500.000 untuk keperluan pribadi.\n 3. Tentukan sisi debit atau kredit untuk bertambahnya akun: Piutang Usaha, Utang Bank,\n     Pendapatan Jasa, Beban Listrik, Prive.\n 4. Sebutkan bukti transaksi untuk: (a) penjualan tunai di toko, (b) tagihan penjualan\n      kredit, (c) penerimaan uang sewa, (d) pengembalian barang kepada pemasok.\n 5. Bedakan perusahaan jasa, dagang, dan manufaktur disertai satu contoh nyata di\n      lingkungan sekitar siswa.\n\nKunci Jawaban Singkat\n      Nomor 2: (a) Aset +30 jt, Ekuitas +30 jt. (b) Aset +1,2 jt, Liabilitas +1,2 jt. (c) Aset +2,5 jt,\n      Ekuitas +2,5 jt. (d) Aset −1,2 jt, Liabilitas −1,2 jt. (e) Aset −0,5 jt, Ekuitas −0,5 jt.\n      Nomor 3: Piutang Usaha (debit), Utang Bank (kredit), Pendapatan Jasa (kredit), Beban\n      Listrik (debit), Prive (debit).\n      Nomor 4: (a) nota atau struk, (b) faktur atau invoice, (c) kuitansi, (d) nota debit.", "Modul 2. Akuntansi Perusahaan Jasa, Dagang, dan Manufaktur\n\nTujuan Pembelajaran\nSetelah mempelajari modul ini, peserta didik mampu:\n\n 1. Mencatat transaksi ke dalam jurnal umum dan memindahkannya ke buku besar.\n 2. Menyusun neraca saldo dan kertas kerja.\n 3. Membuat jurnal penyesuaian dan jurnal penutup.\n 4. Menyusun laporan laba rugi, perubahan modal, neraca, dan arus kas.\n 5. Membedakan perlakuan akuntansi untuk perusahaan jasa, dagang, dan manufaktur.\n\nA. Siklus Akuntansi Perusahaan Jasa\n\n  Tahap          Kegiatan\n\n  1              Menganalisis bukti transaksi\n\n  2              Mencatat ke jurnal umum\n\n  3              Memposting ke buku besar\n\n  4              Menyusun neraca saldo sebelum penyesuaian\n\n  5              Membuat jurnal penyesuaian\n\n  6              Menyusun neraca saldo setelah penyesuaian\n\n  7              Menyusun laporan keuangan\n\n  8              Membuat jurnal penutup\n  Tahap          Kegiatan\n\n  9              Menyusun neraca saldo setelah penutupan\n\n  10             (Opsional) Jurnal pembalik\n\n1. Jurnal umum\n\nJurnal umum adalah catatan kronologis pertama atas transaksi. Kolomnya: tanggal,\nketerangan (akun dan uraian), referensi (ref), debit, dan kredit. Akun yang didebit ditulis\nlebih dulu di sebelah kiri, akun yang dikredit menjorok ke kanan.\n\nContoh jurnal Salon Cantika, bulan Januari\n\n  Tanggal           Keterangan             Ref    Debit          Kredit\n\n  1 Jan             Kas                    111    40.000.000\n\n                    Modal Ibu Cantika      311                   40.000.000\n\n  3 Jan             Peralatan Salon        151    12.000.000\n\n                    Kas                    111                   12.000.000\n\n  5 Jan             Perlengkapan Salon     141    2.000.000\n\n                    Utang Usaha            211                   2.000.000\n\n  10 Jan            Kas                    111    3.500.000\n\n                    Pendapatan Jasa        411                   3.500.000\n\n  15 Jan            Beban Gaji             511    1.800.000\n\n                    Kas                    111                   1.800.000\n\n  20 Jan            Prive                  312    500.000\n\n                    Kas                    111                   500.000\n\n2. Buku besar\n\nBuku besar adalah kumpulan seluruh akun. Memposting berarti memindahkan angka\njurnal ke akun yang sesuai, lalu mengisi kolom referensi pada kedua sisi agar mudah\nditelusuri. Contoh akun Kas dari jurnal di atas:\n\n Tanggal Keterangan               Ref    Debit        Kredit     Saldo\n\n 1 Jan         Setoran modal      J1     40.000.000              40.000.000\n\n 3 Jan         Beli peralatan     J1                  12.000.000 28.000.000\n Tanggal Keterangan            Ref     Debit       Kredit      Saldo\n\n 10 Jan        Pendapatan jasa J1      3.500.000               31.500.000\n\n 15 Jan        Bayar gaji      J1                  1.800.000   29.700.000\n\n 20 Jan        Prive           J1                  500.000     29.200.000\n\n3. Neraca saldo\n\nNeraca saldo adalah daftar seluruh akun buku besar beserta saldonya pada suatu tanggal.\nFungsinya menguji keseimbangan: total saldo debit harus sama dengan total saldo\nkredit. Kesamaan ini belum menjamin bebas kesalahan (misalnya salah akun atau\ntransaksi yang tidak tercatat), tetapi ketidaksamaan pasti menandakan ada kesalahan.\n\n4. Jurnal penyesuaian\n\nJurnal penyesuaian dibuat pada akhir periode agar pendapatan dan beban dicatat pada\nperiode yang benar (basis akrual). Jenis-jenisnya:\n\n  Jenis penyesuaian                  Contoh                            Jurnal\n\n  Perlengkapan terpakai              Perlengkapan awal 2.000.000,      Beban Perlengkapan 1.400.000\n                                     sisa akhir 600.000                (D) / Perlengkapan 1.400.000\n                                                                       (K)\n\n  Penyusutan aset tetap              Peralatan 12.000.000, umur 5      Beban Penyusutan Peralatan\n                                     tahun, tanpa nilai residu,        200.000 (D) / Akumulasi\n                                     sebulan = 200.000                 Penyusutan Peralatan 200.000\n                                                                       (K)\n\n  Beban dibayar di muka              Sewa 12 bulan Rp6.000.000         Beban Sewa 500.000 (D) /\n                                     dibayar 1 Jan, dicatat ke Sewa    Sewa Dibayar Dimuka 500.000\n                                     Dibayar Dimuka, berlaku 1         (K)\n                                     bulan\n\n  Beban yang masih harus             Gaji Januari Rp300.000 belum      Beban Gaji 300.000 (D) /\n  dibayar                            dibayar                           Utang Gaji 300.000 (K)\n\n  Pendapatan diterima di             Terima bayaran paket 3 bulan      Pendapatan Diterima Dimuka\n  muka                               Rp900.000, sebulan sudah          300.000 (D) / Pendapatan Jasa\n                                     dikerjakan                        300.000 (K)\n\n  Pendapatan yang masih              Jasa selesai Rp400.000 belum      Piutang Usaha 400.000 (D) /\n  harus diterima                     ditagih                           Pendapatan Jasa 400.000 (K)\n\nRumus penyusutan metode garis lurus:\n   \\text{Penyusutan per tahun} = \\frac{\\text{Harga perolehan} - \\text{Nilai\n   residu}}{\\text{Umur ekonomis}}\n\n5. Kertas kerja (neraca lajur)\n\nKertas kerja adalah alat bantu untuk menyusun laporan keuangan. Kolomnya umumnya:\nneraca saldo, penyesuaian, neraca saldo disesuaikan, laba rugi, dan neraca. Selisih antara\nkolom debit dan kredit pada laba rugi adalah laba atau rugi bersih. Selisih yang sama harus\nmuncul di kolom neraca.\n\n6. Laporan keuangan perusahaan jasa\n\nContoh Salon Cantika (disederhanakan, setelah penyesuaian):\n\nLaporan Laba Rugi, bulan yang berakhir 31 Januari\n\n  Uraian                                  Jumlah (Rp)\n\n  Pendapatan Jasa                         3.500.000\n\n  Beban Gaji                              2.100.000\n\n  Beban Perlengkapan                      1.400.000\n\n  Beban Penyusutan Peralatan              200.000\n\n  Total beban                             3.700.000\n\n  Rugi bersih                             (200.000)\n\nLaporan Perubahan Modal\n\n  Uraian                    Jumlah (Rp)\n\n  Modal awal                40.000.000\n\n  Rugi bersih               (200.000)\n\n  Prive                     (500.000)\n\n  Modal akhir               39.300.000\n\nLaporan Posisi Keuangan (Neraca) terdiri dari aset (kas, perlengkapan, peralatan setelah\ndikurangi akumulasi penyusutan), liabilitas (utang usaha, utang gaji), dan ekuitas (modal\nakhir). Jumlah aset harus sama dengan jumlah liabilitas ditambah ekuitas.\n\nLaporan Arus Kas menyajikan penerimaan dan pengeluaran kas dalam tiga aktivitas:\n  Aktivitas                 Isi                                      Contoh\n\n  Operasi                   Kas dari kegiatan utama                  Penerimaan jasa, pembayaran gaji,\n                                                                     beban\n\n  Investasi                 Kas dari perolehan dan pelepasan         Beli peralatan, jual kendaraan\n                            aset jangka panjang\n\n  Pendanaan                 Kas dari pemilik dan kreditur            Setoran modal, prive, penerimaan\n                                                                     pinjaman bank\n\nUntuk Salon Cantika: arus kas operasi = 3.500.000 − 1.800.000 = 1.700.000. Arus kas\ninvestasi = (12.000.000). Arus kas pendanaan = 40.000.000 − 500.000 = 39.500.000.\nKenaikan kas bersih = 29.200.000, sama dengan saldo kas akhir pada buku besar (kas awal\nnol).\n\n7. Jurnal penutup\n\nJurnal penutup menolkan akun sementara (nominal), yaitu pendapatan, beban, dan prive,\nlalu memindahkan hasilnya ke akun modal.\n\n 1. Tutup akun pendapatan: Pendapatan Jasa (D) / Ikhtisar Laba Rugi (K).\n 2. Tutup akun beban: Ikhtisar Laba Rugi (D) / masing-masing akun beban (K).\n 3. Tutup Ikhtisar Laba Rugi: bila laba, Ikhtisar Laba Rugi (D) / Modal (K). Bila rugi, Modal\n     (D) / Ikhtisar Laba Rugi (K).\n 4. Tutup Prive: Modal (D) / Prive (K).\n\nB. Akuntansi Perusahaan Dagang\nPerbedaan utama dengan perusahaan jasa adalah adanya persediaan barang dagang dan\nakun-akun terkait pembelian dan penjualan.\n\n1. Sistem pencatatan persediaan\n\n  Aspek                            Periodik (fisik)                     Perpetual\n\n  Pencatatan                       Akun Pembelian                       Langsung ke akun Persediaan\n  pembelian                                                             Barang Dagang\n\n  Pencatatan                       Hanya pendapatan                     Pendapatan + Harga Pokok\n  penjualan                                                             Penjualan (HPP)\n\n  Saldo persediaan                 Diketahui lewat stock opname di      Selalu terbarui\n                                   akhir periode\n  Aspek                     Periodik (fisik)                    Perpetual\n\n  Cocok untuk               Usaha kecil                         Usaha dengan sistem komputer\n                                                                atau barcode\n\n2. Jurnal khas perusahaan dagang (metode periodik)\n\n  Transaksi                       Jurnal\n\n  Beli barang tunai               Pembelian (D) / Kas (K)\n\n  Beli barang kredit              Pembelian (D) / Utang Dagang (K)\n\n  Beban angkut pembelian          Beban Angkut Pembelian (D) / Kas (K)\n\n  Retur pembelian                 Utang Dagang (D) / Retur Pembelian (K)\n\n  Potongan pembelian              Utang Dagang (D) / Kas (K) dan Potongan\n                                  Pembelian (K)\n\n  Jual barang kredit              Piutang Dagang (D) / Penjualan (K)\n\n  Retur penjualan                 Retur Penjualan (D) / Piutang Dagang (K)\n\n  Potongan penjualan              Kas (D) dan Potongan Penjualan (D) / Piutang\n                                  Dagang (K)\n\nSyarat pembayaran. Syarat 2/10, n/30 artinya diskon 2% jika dibayar dalam 10 hari sejak\nfaktur, dan jatuh tempo penuh 30 hari. Syarat FOB Shipping Point berarti beban angkut\nditanggung pembeli, sedangkan FOB Destination ditanggung penjual.\n\n3. Harga Pokok Penjualan (HPP) metode periodik\n\n   \\text{HPP} = \\text{Persediaan awal} + \\text{Pembelian bersih} + \\text{Beban\n   angkut pembelian} - \\text{Persediaan akhir}\n\nContoh. Persediaan awal 10.000.000, pembelian 60.000.000, retur pembelian 2.000.000,\npotongan pembelian 1.000.000, beban angkut pembelian 1.500.000, persediaan akhir\n12.000.000.\n\n  Uraian                            Jumlah (Rp)\n\n  Pembelian                         60.000.000\n\n  Retur pembelian                   (2.000.000)\n\n  Potongan pembelian                (1.000.000)\n  Uraian                        Jumlah (Rp)\n\n  Pembelian bersih              57.000.000\n\n  Beban angkut pembelian        1.500.000\n\n  Pembelian bersih + angkut     58.500.000\n\n  Persediaan awal               10.000.000\n\n  Barang tersedia dijual        68.500.000\n\n  Persediaan akhir              (12.000.000)\n\n  HPP                           56.500.000\n\n4. Laporan laba rugi perusahaan dagang (bentuk skontro atau staffel)\n\n  Uraian                                                Jumlah (Rp)\n\n  Penjualan                                             100.000.000\n\n  Retur penjualan dan potongan penjualan                (3.000.000)\n\n  Penjualan bersih                                      97.000.000\n\n  HPP                                                   (56.500.000)\n\n  Laba kotor                                            40.500.000\n\n  Beban operasional (gaji, sewa, listrik, penyusutan)   (25.000.000)\n\n  Laba bersih                                           15.500.000\n\n5. Jurnal penyesuaian dan penutup tambahan. Selain penyesuaian pada perusahaan jasa,\nada penyesuaian persediaan pada metode periodik: Ikhtisar Laba Rugi (D) / Persediaan\nBarang Dagang (K) untuk persediaan awal, dan Persediaan Barang Dagang (D) / Ikhtisar\nLaba Rugi (K) untuk persediaan akhir. Ada pula penyesuaian kerugian piutang tak\ntertagih, yang dibahas di Modul 3.\n\nC. Akuntansi Perusahaan Manufaktur\nPerusahaan manufaktur memiliki tiga jenis persediaan: bahan baku, barang dalam proses\n(BDP), dan barang jadi.\n\n1. Unsur biaya produksi\n  Unsur                     Pengertian                        Contoh\n\n  Bahan baku                Bahan yang menjadi bagian         Tepung pada pabrik roti\n  langsung                  utama produk dan mudah\n                            ditelusuri\n\n  Tenaga kerja              Upah pekerja yang langsung        Upah tukang roti\n  langsung                  membuat produk\n\n  Biaya overhead            Biaya produksi selain dua unsur   Listrik pabrik, penyusutan mesin,\n  pabrik (BOP)              di atas                           bahan penolong, gaji mandor\n\n   \\text{Harga pokok produksi} = \\text{BB langsung} + \\text{TK langsung} +\n   \\text{BOP} + \\text{BDP awal} - \\text{BDP akhir}\n\n2. Laporan harga pokok produksi (contoh)\n\n  Uraian                                                  Jumlah (Rp)\n\n  Persediaan bahan baku awal                              5.000.000\n\n  Pembelian bahan baku                                    40.000.000\n\n  Bahan baku tersedia                                     45.000.000\n\n  Persediaan bahan baku akhir                             (6.000.000)\n\n  Bahan baku terpakai                                     39.000.000\n\n  Tenaga kerja langsung                                   25.000.000\n\n  BOP (listrik 4 jt, penyusutan mesin 3 jt, bahan         9.000.000\n  penolong 2 jt)\n\n  Total biaya produksi                                    73.000.000\n\n  BDP awal                                                4.000.000\n\n  BDP akhir                                               (3.000.000)\n\n  Harga pokok produksi                                    74.000.000\n\n3. Harga pokok penjualan perusahaan manufaktur\n\n   \\text{HPP} = \\text{Barang jadi awal} + \\text{Harga pokok produksi} -\n   \\text{Barang jadi akhir}\nBila barang jadi awal 8.000.000 dan barang jadi akhir 10.000.000, maka HPP = 8.000.000 +\n74.000.000 − 10.000.000 = 72.000.000. Angka ini masuk ke laporan laba rugi menggantikan\nakun pembelian pada perusahaan dagang.\n\n4. Perbandingan ketiga jenis perusahaan\n\n  Aspek                     Jasa                   Dagang                Manufaktur\n\n  Sumber                    Pendapatan jasa        Penjualan             Penjualan\n  pendapatan\n\n  Persediaan                Tidak ada (hanya       Barang dagang         Bahan baku, BDP,\n                            perlengkapan)                                barang jadi\n\n  Harga pokok               Tidak ada              HPP dari              HPP dari harga pokok\n                                                   pembelian             produksi\n\n  Laporan                   Tidak ada              Perhitungan HPP       Laporan harga pokok\n  tambahan                                                               produksi\n\n  Kertas kerja              Sederhana              Ada kolom             Ada kolom harga pokok\n                                                   persediaan            produksi\n\nRangkuman Modul 2\n     Siklus akuntansi berjalan dari bukti transaksi sampai neraca saldo setelah penutupan.\n     Jurnal penyesuaian menyesuaikan akun dengan basis akrual, sedangkan jurnal\n     penutup menolkan akun sementara.\n     Empat laporan keuangan utama: laba rugi, perubahan modal, posisi keuangan, dan arus\n     kas.\n     Perusahaan dagang menambahkan HPP dan akun pembelian atau penjualan.\n     Perusahaan manufaktur menambahkan laporan harga pokok produksi.\n\nLatihan Modul 2\n 1. Buat jurnal umum untuk transaksi Bengkel Mandiri selama Februari (setor modal 25 jt,\n     beli peralatan tunai 8 jt, pendapatan jasa tunai 6 jt, bayar gaji 2 jt, beli suku cadang\n     kredit 3 jt).\n 2. Posting jurnal tersebut ke akun Kas dan susun neraca saldo.\n 3. Buat jurnal penyesuaian: perlengkapan awal 1.500.000 sisa 400.000, penyusutan\n     peralatan 8 jt umur 4 tahun (sebulan), gaji belum dibayar 250.000.\n 4. Hitung HPP perusahaan dagang: persediaan awal 7 jt, pembelian 45 jt, retur pembelian\n     1,5 jt, potongan pembelian 0,5 jt, beban angkut 1 jt, persediaan akhir 9 jt.\n 5. Hitung harga pokok produksi dan HPP perusahaan manufaktur dari data: bahan baku\n     terpakai 30 jt, tenaga kerja langsung 18 jt, BOP 12 jt, BDP awal 3 jt, BDP akhir 2 jt, barang\n     jadi awal 5 jt, barang jadi akhir 6 jt.\n 6. Susun laporan arus kas sederhana dari data transaksi pada nomor 1.\n\nKunci Jawaban Singkat\n     Nomor 3: Beban perlengkapan 1.100.000. Beban penyusutan 166.667 (8.000.000 : 4 : 12,\n     dibulatkan). Beban gaji 250.000 dan utang gaji 250.000.\n     Nomor 4: Pembelian bersih = 45.000.000 − 1.500.000 − 500.000 = 43.000.000.\n     Ditambah angkut 1.000.000 = 44.000.000. Barang tersedia dijual = 51.000.000. HPP =\n     51.000.000 − 9.000.000 = 42.000.000.\n     Nomor 5: Harga pokok produksi = 30 + 18 + 12 + 3 − 2 = 61 juta. HPP = 5 + 61 − 6 = 60 juta.", "Modul 3. Akuntansi Keuangan\n\nTujuan Pembelajaran\nSetelah mempelajari modul ini, peserta didik mampu:\n\n 1. Mencatat dan melaporkan kas, termasuk dana kas kecil dan rekonsiliasi bank.\n 2. Mencatat piutang dan menghitung kerugian piutang tak tertagih.\n 3. Mencatat dan menilai persediaan dengan metode FIFO dan rata-rata.\n 4. Mencatat perolehan, penyusutan, dan pelepasan aset tetap.\n 5. Mencatat kewajiban jangka pendek dan jangka panjang.\n\nA. Kas dan Setara Kas\nKas meliputi uang tunai, saldo rekening giro atau tabungan, cek, dan bilyet giro yang\nsudah jatuh tempo. Setara kas adalah investasi jangka pendek yang sangat likuid, misalnya\ndeposito berjangka waktu tiga bulan atau kurang.\n\n1. Pengendalian internal atas kas. Prinsip utama: pemisahan tugas (yang menerima,\nmenyimpan, dan mencatat kas adalah orang berbeda), semua penerimaan disetor penuh\nke bank, pengeluaran dengan cek atau transfer, serta pemeriksaan kas secara berkala.\n\n2. Dana kas kecil (petty cash). Dana kas kecil dipakai untuk pengeluaran kecil rutin.\nSistem yang umum adalah imprest: dana diisi kembali sehingga jumlahnya selalu kembali\nke nilai awal.\n  Peristiwa                                      Jurnal\n\n  Pembentukan dana Rp1.000.000                   Kas Kecil 1.000.000 (D) / Kas di Bank\n                                                 1.000.000 (K)\n\n  Pengisian kembali setelah dipakai: perangko    Beban Perangko 150.000, Beban Konsumsi\n  150.000, konsumsi 300.000, transportasi        300.000, Beban Transportasi 250.000 (D) /\n  250.000                                        Kas di Bank 700.000 (K)\n\nPada sistem imprest, akun Kas Kecil hanya dijurnal saat dana dibentuk atau jumlahnya\ndiubah.\n\n3. Rekonsiliasi bank. Saldo kas menurut buku perusahaan sering berbeda dengan saldo\nrekening koran bank. Rekonsiliasi dibuat untuk mencari sebab selisih lalu\nmenyesuaikannya.\n\n  Penyebab selisih                                        Penyesuaian pada\n\n  Setoran dalam perjalanan                                Saldo bank (ditambah)\n\n  Cek yang belum dicairkan                                Saldo bank (dikurangi)\n\n  Jasa giro / bunga yang belum dicatat perusahaan         Saldo buku (ditambah)\n\n  Biaya administrasi bank yang belum dicatat              Saldo buku (dikurangi)\n  perusahaan\n\n  Kesalahan pencatatan                                    Saldo yang salah\n\nContoh. Saldo bank 18.500.000. Setoran dalam perjalanan 2.000.000. Cek beredar\n1.200.000. Saldo buku 19.350.000. Jasa giro 100.000. Biaya administrasi 150.000.\n\n     Saldo bank disesuaikan: 18.500.000 + 2.000.000 − 1.200.000 = 19.300.000.\n     Saldo buku disesuaikan: 19.350.000 + 100.000 − 150.000 = 19.300.000.\n\nKedua saldo disesuaikan sama besar, yaitu Rp19.300.000, sehingga rekonsiliasi selesai.\nSaldo inilah yang disajikan di neraca. Bila tidak sama, selisihnya harus dicari, misalnya\nsalah catat cek atau setoran.\n\nB. Piutang\nPiutang usaha adalah tagihan kepada pelanggan atas penjualan kredit. Piutang wesel\ndidukung surat janji tertulis. Piutang lain-lain adalah tagihan di luar penjualan, misalnya\npinjaman karyawan.\n\nKerugian piutang tak tertagih diperlakukan dengan dua metode:\n  Metode                    Cara kerja                          Jurnal\n\n  Penghapusan               Beban dicatat saat piutang          Kerugian Piutang (D) / Piutang\n  langsung                  pasti tak tertagih                  Usaha (K)\n\n  Penyisihan                Beban diestimasi pada akhir         Beban Kerugian Piutang (D) /\n  (cadangan)                periode                             Cadangan Kerugian Piutang (K)\n\nMetode penyisihan lebih sesuai dengan basis akrual karena beban dicatat pada periode\nyang sama dengan penjualannya.\n\nContoh. Piutang usaha akhir tahun 80.000.000. Estimasi tak tertagih 3% dari piutang.\n\n     Penyisihan = 3% × 80.000.000 = 2.400.000.\n     Jurnal: Beban Kerugian Piutang 2.400.000 (D) / Cadangan Kerugian Piutang 2.400.000\n     (K).\n     Di neraca: Piutang usaha 80.000.000 dikurangi cadangan 2.400.000 = piutang bersih\n     77.600.000.\n\nPenghapusan piutang pasti macet. Cadangan Kerugian Piutang (D) / Piutang Usaha (K).\nPemulihan piutang yang pernah dihapus dijurnal dengan membalik penghapusan terlebih\ndahulu, lalu mencatat penerimaan kas.\n\nC. Persediaan\nPersediaan adalah barang yang dimiliki untuk dijual atau diolah. Persediaan dinilai pada\nnilai terendah antara harga perolehan dan nilai realisasi neto.\n\nMetode penilaian persediaan (sistem perpetual):\n\n  Metode                        Prinsip                             Dampak saat harga naik\n\n  FIFO (masuk pertama           Barang yang dibeli lebih dulu       Persediaan akhir mendekati\n  keluar pertama)               dijual lebih dulu                   harga terbaru, laba lebih tinggi\n\n  Rata-rata bergerak            Harga pokok dihitung rata-rata      Hasil di antara FIFO dan LIFO\n  (moving average)              setiap ada pembelian\n\nLIFO tidak diperkenankan oleh standar akuntansi keuangan di Indonesia.\n\nContoh kartu persediaan. Pembelian 1: 100 unit @ Rp10.000. Pembelian 2: 100 unit @\nRp12.000. Penjualan 150 unit.\n  Metode                                       HPP penjualan 150 unit           Persediaan akhir\n                                                                                50 unit\n\n  FIFO                                         (100 × 10.000) + (50 × 12.000)   50 × 12.000 =\n                                               = 1.600.000                      600.000\n\n  Rata-rata (setelah pembelian 2:              150 × 11.000 = 1.650.000         50 × 11.000 =\n  2.200.000 : 200 = 11.000)                                                     550.000\n\nKesimpulan: pada harga naik, FIFO menghasilkan HPP lebih kecil sehingga laba lebih besar\ndibanding rata-rata.\n\nTaksiran persediaan akhir (metode laba kotor) berguna bila persediaan rusak atau hilang\ndan data fisik tidak ada.\n\nD. Aset Tetap\nAset tetap adalah aset berwujud yang dipakai dalam operasi, bukan untuk dijual, dengan\nmasa manfaat lebih dari satu periode. Contoh: tanah, gedung, mesin, kendaraan,\nperalatan.\n\n1. Harga perolehan mencakup harga beli ditambah semua biaya sampai aset siap dipakai\n(pengangkutan, pemasangan, bea balik nama).\n\nContoh. Mesin dibeli 50.000.000, ongkos angkut 1.500.000, pemasangan 2.500.000. Harga\nperolehan = 54.000.000.\n\nJurnal: Mesin 54.000.000 (D) / Kas 54.000.000 (K).\n\n2. Penyusutan. Tanah tidak disusutkan. Metode yang umum diajarkan:\n\n  Metode                    Rumus                                           Karakter\n\n  Garis lurus               (Harga perolehan − residu) : umur               Beban sama tiap tahun\n\n  Saldo menurun             Tarif × nilai buku awal tahun                   Beban besar di awal\n\n  Jumlah angka              (Sisa umur : jumlah angka tahun) × (HP −        Beban menurun\n  tahun                     residu)                                         bertahap\n\n  Unit produksi             (HP − residu) : total unit × unit tahun ini     Mengikuti pemakaian\n\nContoh garis lurus. Mesin 54.000.000, residu 4.000.000, umur 5 tahun. Penyusutan per\ntahun = (54.000.000 − 4.000.000) : 5 = 10.000.000.\n\nJurnal akhir tahun: Beban Penyusutan Mesin 10.000.000 (D) / Akumulasi Penyusutan\nMesin 10.000.000 (K).\nContoh saldo menurun (tarif dua kali garis lurus = 40%): tahun 1 = 40% × 54.000.000 =\n21.600.000. Nilai buku awal tahun 2 = 32.400.000, penyusutan tahun 2 = 12.960.000. Residu\ntidak dipakai dalam perhitungan tarif, tetapi nilai buku akhir tidak boleh di bawah residu.\n\n3. Pelepasan aset. Aset dilepas dengan penjualan, pertukaran, atau penghapusan. Laba\natau rugi dihitung dengan membandingkan harga jual dengan nilai buku.\n\nContoh. Mesin yang harga perolehannya 54.000.000 dan akumulasi penyusutannya\n30.000.000 dijual tunai 20.000.000. Nilai buku = 24.000.000. Rugi penjualan = 4.000.000.\n\n  Akun                           Debit          Kredit\n\n  Kas                            20.000.000\n\n  Akumulasi Penyusutan Mesin     30.000.000\n\n  Rugi Penjualan Aset Tetap      4.000.000\n\n  Mesin                                         54.000.000\n\n4. Pengeluaran setelah perolehan. Pengeluaran yang menambah masa manfaat atau\nkapasitas (pengeluaran modal) dicatat sebagai aset. Pengeluaran perawatan rutin\n(pengeluaran pendapatan) dicatat sebagai beban.\n\nE. Kewajiban (Liabilitas)\n1. Kewajiban jangka pendek jatuh tempo dalam satu tahun atau satu siklus operasi.\n\n  Jenis                        Contoh                         Catatan\n\n  Utang usaha                  Utang pembelian barang         Dicatat pada faktur\n                               secara kredit\n\n  Utang wesel                  Utang dengan janji tertulis    Ada bunga\n\n  Utang gaji                   Gaji yang belum dibayar        Hasil jurnal penyesuaian\n\n  Utang pajak                  PPh 21, PPN                    Dibahas di Modul 5\n\n  Pendapatan diterima di       Uang muka pelanggan            Menjadi pendapatan saat jasa\n  muka                                                        diberikan\n\n  Bagian lancar utang jangka   Cicilan yang jatuh tempo       Dipindahkan dari jangka\n  panjang                      dalam setahun                  panjang\n\nBunga sederhana:\n   \\text{Bunga} = \\text{Pokok} \\times \\text{Tarif per tahun} \\times\n   \\frac{\\text{Jumlah bulan}}{12}\n\nContoh. Pinjaman wesel Rp20.000.000, bunga 12% per tahun, jangka 3 bulan. Bunga =\n20.000.000 × 12% × 3/12 = 600.000. Saat jatuh tempo dibayar 20.600.000.\n\n2. Kewajiban jangka panjang jatuh tempo lebih dari satu tahun: utang bank, utang\nobligasi, utang hipotek, dan utang sewa pembiayaan.\n\nContoh utang bank dengan angsuran tetap. Pinjaman bank 60.000.000, pokok dicicil\n5.000.000 per bulan, bunga 1% per bulan dari sisa pokok.\n\n Bulan       Sisa pokok awal Bunga 1% Cicilan pokok Total bayar Sisa pokok akhir\n\n 1           60.000.000      600.000   5.000.000     5.600.000   55.000.000\n\n 2           55.000.000      550.000   5.000.000     5.550.000   50.000.000\n\nJurnal bulan pertama: Beban Bunga 600.000 dan Utang Bank 5.000.000 (D) / Kas\n5.600.000 (K).\n\nPenyajian di neraca. Utang bank dipecah menjadi bagian lancar (cicilan 12 bulan ke depan,\nyaitu 60.000.000) dan bagian jangka panjang (sisanya). Pada contoh ini seluruh pokok\njatuh tempo dalam 12 bulan, sehingga seluruhnya menjadi kewajiban jangka pendek pada\nakhir tahun pertama.\n\nRangkuman Modul 3\n     Kas dikendalikan dengan pemisahan tugas, dana kas kecil sistem imprest, dan\n     rekonsiliasi bank.\n     Piutang disajikan bersih setelah cadangan kerugian piutang.\n     Persediaan dinilai dengan FIFO atau rata-rata. Pada harga naik, FIFO menghasilkan laba\n     lebih besar.\n     Aset tetap dicatat pada harga perolehan dan disusutkan sepanjang umur manfaat.\n     Tanah tidak disusutkan.\n     Kewajiban dipisahkan menjadi jangka pendek dan jangka panjang menurut jatuh\n     tempo.\n\nLatihan Modul 3\n 1. Susun rekonsiliasi bank dari data: saldo bank 25.000.000, setoran dalam perjalanan\n     3.000.000, cek beredar 2.200.000, saldo buku 25.880.000, jasa giro 200.000, biaya\n     administrasi 100.000, kesalahan pencatatan: cek pembayaran utang sebenarnya\n     1.200.000 dicatat 1.020.000. Buat jurnal penyesuaiannya.\n 2. Piutang usaha 120.000.000, estimasi tak tertagih 2,5%. Hitung penyisihan dan sajikan di\n     neraca.\n 3. Hitung HPP dan persediaan akhir metode FIFO dan rata-rata dari data: beli 200 unit\n     @8.000, beli 300 unit @9.000, jual 350 unit.\n 4. Hitung penyusutan tahun 1 dan 2 untuk kendaraan seharga 120.000.000, residu\n     20.000.000, umur 5 tahun, dengan metode garis lurus dan saldo menurun (tarif 40%).\n 5. Pinjaman wesel 15.000.000, bunga 10% per tahun, jangka 6 bulan. Hitung bunga dan\n     buat jurnal saat pinjaman diterima serta saat dilunasi.\n\nKunci Jawaban Singkat\n     Nomor 1: saldo bank disesuaikan 25.800.000, sama dengan saldo buku disesuaikan\n     (25.880.000 + 200.000 − 100.000 − 180.000). Jurnal: Kas di Bank 200.000 (D) /\n     Pendapatan Jasa Giro 200.000 (K); Beban Administrasi Bank 100.000 (D) / Kas di Bank\n     100.000 (K); Utang Usaha 180.000 (D) / Kas di Bank 180.000 (K). Nomor 2: 2,5% ×\n     120.000.000 = 3.000.000. Piutang bersih = 117.000.000.\n     Nomor 3: FIFO: HPP = (200 × 8.000) + (150 × 9.000) = 2.950.000, persediaan akhir 150 ×\n     9.000 = 1.350.000. Rata-rata: 4.300.000 : 500 = 8.600, HPP = 350 × 8.600 = 3.010.000,\n     persediaan akhir = 150 × 8.600 = 1.290.000.\n     Nomor 4: Garis lurus = 20.000.000 per tahun. Saldo menurun: tahun 1 = 48.000.000,\n     tahun 2 = 40% × 72.000.000 = 28.800.000.\n     Nomor 5: Bunga = 15.000.000 × 10% × 6/12 = 750.000. Dibayar lunas 15.750.000.", "Modul 4. Praktikum Akuntansi Lembaga / Instansi Pemerintah\n\nTujuan Pembelajaran\nSetelah mempelajari modul ini, peserta didik mampu:\n\n 1. Menjelaskan karakteristik akuntansi pemerintah dan perbedaannya dengan akuntansi\n     perusahaan.\n 2. Menguraikan siklus pengelolaan keuangan desa: perencanaan, penganggaran,\n     pelaksanaan, penatausahaan, pelaporan, dan pertanggungjawaban.\n 3. Membaca struktur APBDes dan menyusun anggaran sederhana.\n 4. Mencatat transaksi pada Buku Kas Umum, Buku Pembantu Pajak, Buku Bank, dan Buku\n     Pembantu Kegiatan.\n 5. Menjelaskan alur keuangan pemerintah daerah dan jenis laporan keuangannya.\n    Catatan untuk guru: dasar hukum utama pengelolaan keuangan desa adalah\n    Permendagri Nomor 20 Tahun 2018, dan untuk pemerintah daerah Permendagri\n    Nomor 77 Tahun 2020. Periksa kembali perubahan regulasi terbaru dan format\n    aplikasi yang digunakan pemerintah desa setempat (misalnya Siskeudes) sebelum\n    praktikum.\n\nA. Karakteristik Akuntansi Pemerintah\n\n  Aspek                     Perusahaan              Pemerintah / lembaga publik\n\n  Tujuan                    Mencari laba            Melayani publik dan akuntabilitas\n\n  Sumber dana               Modal, penjualan        Pajak, retribusi, transfer, hibah\n\n  Anggaran                  Alat perencanaan        Dokumen hukum yang mengikat (APBN,\n                            internal                APBD, APBDes)\n\n  Ukuran                    Laba                    Kepatuhan, efisiensi, capaian layanan\n  keberhasilan\n\n  Ekuitas                   Modal pemilik           Ekuitas dana atau ekuitas pemerintah\n\n  Laporan utama             Laba rugi, neraca       Laporan realisasi anggaran, neraca, laporan\n                                                    operasional\n\nPrinsip pengelolaan keuangan publik yang menjadi pedoman: transparan, akuntabel,\npartisipatif, serta tertib dan disiplin anggaran.\n\nB. Pengelolaan Keuangan Desa\n1. Pelaku pengelolaan keuangan desa\n\n  Pelaku                                        Peran\n\n  Kepala Desa                                   Pemegang kekuasaan pengelolaan keuangan\n                                                desa\n\n  Sekretaris Desa                               Koordinator pelaksana pengelolaan keuangan\n                                                desa\n\n  Kepala Urusan Keuangan (Kaur                  Bendahara desa: menerima, menyimpan,\n  Keuangan)                                     menyetor, membayar, dan mencatat\n\n  Kasi / Kaur teknis                            Pelaksana kegiatan sesuai bidangnya\n  Pelaku                                                Peran\n\n  BPD                                                   Membahas dan menyepakati rancangan APBDes\n                                                        serta mengawasi\n\n2. Siklus pengelolaan keuangan desa\n\n  Tahap                              Kegiatan pokok                     Dokumen\n\n  Perencanaan                        Musyawarah desa, menyusun          RPJMDes (6 tahun), RKPDes (1\n                                     rencana jangka menengah dan        tahun)\n                                     tahunan\n\n  Penganggaran                       Menyusun, membahas, dan            Rancangan APBDes, APBDes\n                                     menetapkan anggaran                (Peraturan Desa)\n\n  Pelaksanaan                        Penerimaan dan pengeluaran         RAB, RAK, SPP, bukti\n                                     desa                               pengeluaran\n\n  Penatausahaan                      Pencatatan oleh bendahara          BKU, buku pembantu, buku\n                                                                        bank\n\n  Pelaporan                          Laporan semester dan akhir         Laporan realisasi APBDes\n                                     tahun\n\n  Pertanggungjawaban                 Penyampaian                        Laporan pertanggungjawaban\n                                     pertanggungjawaban kepada          realisasi APBDes\n                                     BPD dan bupati/wali kota\n\n3. Struktur APBDes\n\n  Bagian                    Isi                                    Contoh\n\n  Pendapatan                Pendapatan asli desa, transfer, dan    Hasil usaha BUMDes, Dana Desa,\n                            pendapatan lain                        bagian dari hasil pajak dan retribusi\n                                                                   daerah, Alokasi Dana Desa, bantuan\n                                                                   keuangan\n\n  Belanja                   Dikelompokkan menurut bidang           Penyelenggaraan pemerintahan desa,\n                                                                   pelaksanaan pembangunan desa,\n                                                                   pembinaan kemasyarakatan,\n                                                                   pemberdayaan masyarakat,\n                                                                   penanggulangan bencana dan\n                                                                   keadaan darurat\n  Bagian                    Isi                          Contoh\n\n  Pembiayaan                Penerimaan dan pengeluaran   SiLPA tahun lalu, penyertaan modal\n                            pembiayaan                   BUMDes\n\n   \\text{Surplus / (Defisit)} = \\text{Pendapatan} - \\text{Belanja}\n\n   \\text{SiLPA} = \\text{Surplus / (Defisit)} + \\text{Pembiayaan netto}\n\nContoh APBDes sederhana Desa Sukamaju\n  Kode          Uraian                                         Anggaran (Rp)\n\n  1             Pendapatan\n\n  1.1           Pendapatan Asli Desa (hasil BUMDes)            25.000.000\n\n  1.2           Dana Desa                                      800.000.000\n\n  1.3           Alokasi Dana Desa                              450.000.000\n\n  1.4           Bagian dari hasil pajak dan retribusi daerah   60.000.000\n\n                Total pendapatan                               1.335.000.000\n\n  2             Belanja\n\n  2.1           Bidang penyelenggaraan pemerintahan            520.000.000\n\n  2.2           Bidang pelaksanaan pembangunan                 540.000.000\n\n  2.3           Bidang pembinaan kemasyarakatan                90.000.000\n\n  2.4           Bidang pemberdayaan masyarakat                 120.000.000\n\n  2.5
